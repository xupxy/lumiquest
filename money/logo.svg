<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx=".42" cy=".36" r=".8">
      <stop offset="0" stop-color="#f4fffa"/>
      <stop offset=".55" stop-color="#c9f5e3"/>
      <stop offset="1" stop-color="#9fe6d6"/>
    </radialGradient>
    <linearGradient id="body" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#3fe0b0"/>
