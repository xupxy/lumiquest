    <path d="M190 320q17 18 34 0" fill="none" stroke="#073d35" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="140" cy="322" rx="17" ry="10" fill="#ffa3c2" opacity=".85"/>
    <ellipse cx="274" cy="322" rx="17" ry="10" fill="#ffa3c2" opacity=".85"/>
