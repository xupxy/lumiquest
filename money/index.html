<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef5f2">
<title>Гаманець</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:"WInter";src:url(inter-medium-cyr.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"WInter";src:url(inter-bold-cyr.woff) format("woff");font-weight:700;font-display:swap}
@font-face{font-family:"WInter";src:url(inter-extrabold-cyr.woff) format("woff");font-weight:800;font-display:swap}
/* ===== ОСНОВА + ДИЗАЙН «СКЛО» (смарагдовий) ===== */
:root{
  --font:"WInter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.3,1);--spring:cubic-bezier(.34,1.4,.5,1);--safeB:env(safe-area-inset-bottom,0px);
  --bg:#eef5f2;--ink:#0f1f1a;--ink2:#566a63;--ink3:#97aca4;--line:rgba(20,60,50,.09);--hair:rgba(20,60,50,.08);--bg2:rgba(20,90,70,.07);
  --card:rgba(255,255,255,.66);
  --gl:rgba(255,255,255,.62);--gl2:rgba(255,255,255,.82);--glb:rgba(255,255,255,.75);--blur:blur(22px) saturate(180%);
  --sh1:0 1px 2px rgba(10,50,40,.04),0 8px 22px -10px rgba(10,70,55,.18);
  --sh2:0 2px 6px rgba(10,50,40,.05),0 22px 44px -18px rgba(10,70,55,.28);
  --field:rgba(255,255,255,.72);--fline:rgba(20,60,50,.12);
  --acc:#0b9a7a;--acc2:#14b8a6;--accInk:#07745c;--accSoft:rgba(16,185,129,.13);--glow:rgba(16,185,129,.28);
  --exp:#e5484d;--inc:#0c9a6a;--warn:#d97f00;--warnSoft:rgba(245,158,11,.15);--expSoft:rgba(229,72,77,.12);
  --fab:linear-gradient(140deg,#34d399 0%,#10b981 42%,#0d9488 100%);
  --fabSh:0 14px 28px -10px rgba(13,148,136,.65),0 3px 8px rgba(13,148,136,.2),inset 0 1px 0 rgba(255,255,255,.45);
  --hero:linear-gradient(145deg,#0b6e66 0%,#0e9f7e 55%,#3ad6a2 120%);
  --heroSh:0 26px 44px -22px rgba(13,120,100,.7);
  --m1:rgba(110,231,183,.55);--m2:rgba(153,246,228,.5);--m3:rgba(253,230,138,.42);--m4:rgba(165,214,255,.42);
  --sheetBg:color-mix(in srgb,var(--bg) 88%,transparent);
}
.dark{
  --bg:#0a1311;--ink:#eef7f3;--ink2:#a3b8b0;--ink3:#6b8079;--line:rgba(255,255,255,.08);--hair:rgba(255,255,255,.08);--bg2:rgba(255,255,255,.07);
  --card:#16211e;
  --gl:color-mix(in srgb,#17231f 62%,transparent);--gl2:color-mix(in srgb,#17231f 88%,transparent);--glb:rgba(255,255,255,.09);
  --sh1:0 1px 2px rgba(0,0,0,.25),0 10px 26px -12px rgba(0,0,0,.6);
  --sh2:0 2px 6px rgba(0,0,0,.3),0 24px 48px -18px rgba(0,0,0,.7);
  --field:rgba(255,255,255,.06);--fline:rgba(255,255,255,.11);
  --acc:#34d399;--acc2:#2dd4bf;--accInk:#6ee7b7;--accSoft:rgba(52,211,153,.14);--glow:rgba(52,211,153,.25);
  --exp:#ff7275;--inc:#3ddc9f;--warn:#fbbf24;--warnSoft:rgba(251,191,36,.14);--expSoft:rgba(255,114,117,.14);
  --hero:linear-gradient(145deg,#053f38 0%,#0a6f5b 55%,#14a57f 130%);--heroSh:0 26px 44px -22px rgba(0,0,0,.8);
  --m1:rgba(16,185,129,.26);--m2:rgba(20,184,166,.18);--m3:rgba(250,204,21,.07);--m4:rgba(56,130,246,.14);
  --sheetBg:color-mix(in srgb,#14201c 90%,transparent);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font:500 15px/1.42 var(--font);letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;background:transparent}
body.lock{overflow:hidden}
body:before{content:"";position:fixed;inset:-8%;z-index:0;pointer-events:none;
  background:radial-gradient(60% 42% at 8% 4%,var(--m1),transparent 70%),radial-gradient(55% 40% at 100% 30%,var(--m2),transparent 72%),radial-gradient(60% 40% at 0% 78%,var(--m3),transparent 72%),radial-gradient(55% 38% at 100% 100%,var(--m4),transparent 72%),var(--bg);
  }
@keyframes meshDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-2.5%,1.5%,0) scale(1.04)}100%{transform:translate3d(2%,-1.5%,0) scale(1.02)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
.hidden{display:none!important}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px calc(118px + var(--safeB))}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--gl);box-shadow:inset 0 0 0 1px var(--glb),inset 0 1px 0 rgba(255,255,255,.5),var(--sh1)}
.dark .glass{box-shadow:inset 0 0 0 1px var(--glb),inset 0 1px 0 rgba(255,255,255,.05),var(--sh1)}

/* шапка */
.top{padding:22px 2px 0;display:flex;align-items:center;gap:13px}
.brand{width:50px;height:50px;border-radius:17px;flex:none;overflow:hidden;background:#c9f5e3;box-shadow:0 10px 24px -10px rgba(13,148,136,.6),0 0 0 1px rgba(255,255,255,.7) inset,0 0 0 4px rgba(255,255,255,.35)}
.dark .brand{box-shadow:0 10px 28px -10px rgba(16,185,129,.45),0 0 0 4px rgba(255,255,255,.05)}
.brand img{width:100%;height:100%;display:block}
.ttl{flex:1;min-width:0}
.hello{font:600 13px/1.2 var(--font);color:var(--ink2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.hello .demo{font:700 10.5px/1 var(--font);letter-spacing:.04em;padding:4px 7px;border-radius:999px;background:var(--warnSoft);color:var(--warn)}
.hello .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.hello .dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.hello .dot.err{background:var(--exp)}
.top h1{margin:4px 0 0;font:800 26px/1.08 var(--font);letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:21px;height:21px}

/* перемикач місяців */
.msw{display:flex;align-items:center;justify-content:space-between;margin:18px 0 0;padding:5px;border-radius:999px}
.msw button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:transform .3s var(--spring),background .2s}
.msw button svg{width:18px;height:18px}
.msw button:active{transform:scale(.88);background:var(--bg2)}
.msw button:disabled{opacity:.25;pointer-events:none}
.msw .mt{flex:1;text-align:center;font:700 16px/1 var(--font);letter-spacing:-.02em;width:auto;height:40px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.msw .mt small{font:600 11px/1 var(--font);color:var(--acc);letter-spacing:0}

/* герой-баланс */
.hero{margin-top:14px;border-radius:30px;padding:20px 20px 18px;color:#fff;position:relative;overflow:hidden;isolation:isolate;background:var(--hero);box-shadow:var(--heroSh),inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.28),rgba(255,255,255,0));z-index:-1}
.hero:after{content:"";position:absolute;left:-30px;bottom:-90px;width:240px;height:180px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,150,.22),rgba(255,236,150,0));z-index:-1}
.hero .coin{position:absolute;right:18px;top:16px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffd04a 50%,#f0a215);box-shadow:0 8px 18px -6px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.35);display:grid;place-items:center;font:800 19px/1 var(--font);color:#a8650a;text-shadow:0 1px 0 rgba(255,255,255,.6);animation:float 4s ease-in-out infinite}
.hero .coin:after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
@keyframes float{50%{transform:translateY(-5px) rotate(6deg)}}
.hlbl{font:600 13px/1 var(--font);opacity:.85;letter-spacing:.01em}
.hbig{font:800 40px/1.05 var(--font);letter-spacing:-.045em;margin-top:9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbig.neg{color:#ffd1d1}
.hrow{display:flex;gap:8px;margin-top:16px}
.hp{flex:1;min-width:0;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);display:flex;align-items:center;gap:9px;}
.hp i{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.hp i svg{width:16px;height:16px}
.hp span{display:block;font:600 11.5px/1 var(--font);opacity:.82}
.hp b{display:block;font:800 16px/1.1 var(--font);margin-top:4px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.hbar{height:7px;border-radius:5px;background:rgba(255,255,255,.2);margin-top:16px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#fff7c2,#fff);box-shadow:0 0 10px rgba(255,255,255,.6);transition:width .9s var(--ease)}
.hbar i.over{background:linear-gradient(90deg,#ffd0c2,#ff9c9c)}
.hfoot{font:500 13px/1.4 var(--font);margin-top:10px;opacity:.95}
.hfoot b{font-weight:800}

/* секції */
.sec{margin-top:24px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 4px 11px}
.sh h2{margin:0;font:800 19px/1.15 var(--font);letter-spacing:-.03em}
.sh small{font:600 12.5px/1.2 var(--font);color:var(--ink2)}
.sh .lnk{font:700 13.5px/1 var(--font);color:var(--acc);padding:8px 2px;margin:-8px 0}
.card{border-radius:26px;padding:16px}
.ce{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c,#94a3b8) 17%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#94a3b8) 22%,transparent)}
.dark .ce{background:color-mix(in srgb,var(--c,#94a3b8) 22%,transparent)}

/* донат */
.donut{display:flex;flex-direction:column;align-items:center}
.dwrap{position:relative;width:180px;height:180px;margin:4px auto 6px}
.dwrap svg{width:100%;height:100%;display:block;overflow:visible}
.dwrap circle.seg{transition:stroke-dasharray .9s var(--ease),stroke-dashoffset .9s var(--ease),opacity .3s,stroke-width .3s}
.dwrap .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dwrap .dc span{font:600 12px/1 var(--font);color:var(--ink2)}
.dwrap .dc b{font:800 23px/1.1 var(--font);letter-spacing:-.04em;margin-top:5px;font-variant-numeric:tabular-nums}
.dwrap .dc small{font:600 11.5px/1 var(--font);color:var(--ink3);margin-top:4px}
.legend{width:100%;margin-top:8px;display:grid;gap:2px}
.lg{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 6px;border-radius:16px;transition:background .2s,transform .3s var(--spring)}
.lg:active{background:var(--bg2);transform:scale(.98)}
.lg .ce{width:36px;height:36px;font-size:17px}
.lg .lm{flex:1;min-width:0}
.lg .lt{display:flex;align-items:baseline;gap:8px}
.lg .lt b{font:700 14.5px/1.2 var(--font);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .lt em{font:700 12px/1 var(--font);font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}
.lg .lt span{font:800 14.5px/1 var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.lg .lb{height:5px;border-radius:3px;background:var(--bg2);margin-top:6px;overflow:hidden}
.lg .lb i{display:block;height:100%;border-radius:inherit;background:var(--c)}
.lgmore{font:700 13px/1 var(--font);color:var(--acc);padding:10px;text-align:center;width:100%}

/* ліміти */
.lims{display:grid;gap:10px}
.lim{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border-radius:22px;padding:13px 14px 13px 12px}
.lim .lm{flex:1;min-width:0}
.lim .lt{display:flex;align-items:baseline;gap:8px}
.lim .lt b{flex:1;font:700 15px/1.2 var(--font)}
.lim .lt span{font:700 13px/1 var(--font);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.lim .lt span b{color:var(--ink);font-weight:800}
.lim .lb{height:8px;border-radius:5px;background:var(--bg2);margin-top:9px;overflow:hidden}
.lim .lb i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .9s var(--ease)}
.lim.warn .lb i{background:linear-gradient(90deg,#fcd34d,#f59e0b)}
.lim.over .lb i{background:linear-gradient(90deg,#fb7185,#e5484d)}
.lim .ls{font:500 12.5px/1.35 var(--font);color:var(--ink2);margin-top:7px}
.lim.warn .ls{color:var(--warn);font-weight:700}
.lim.over{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--exp) 45%,transparent),var(--sh1)}
.lim.over .ls{color:var(--exp);font-weight:700}
.limempty{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:22px;padding:14px}
.limempty .ri{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--accSoft);flex:none}
.limempty b{display:block;font-size:14.5px}
.limempty span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}

/* рядки операцій */
.day{margin-top:18px}
.dh{display:flex;align-items:baseline;justify-content:space-between;margin:0 6px 8px;font:700 13px/1 var(--font);color:var(--ink2)}
.dh b{font:700 13px/1 var(--font);color:var(--ink);letter-spacing:-.01em}
.dh span{font-variant-numeric:tabular-nums}
.dlist{border-radius:24px;padding:4px}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 10px;border-radius:20px;transition:background .2s,transform .3s var(--spring)}
.tx:active{background:var(--bg2);transform:scale(.985)}
.tx+.tx{position:relative}
.tx+.tx:before{content:"";position:absolute;left:64px;right:12px;top:0;height:1px;background:var(--hair)}
.tx .tm{flex:1;min-width:0}
.tx .tm b{display:block;font:700 15px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.tx .tm small{display:block;font:500 12.5px/1.25 var(--font);color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .ta{text-align:right;font:800 15.5px/1.2 var(--font);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.tx .ta small{display:block;font:600 11.5px/1.2 var(--font);color:var(--ink3);margin-top:2px}
.tx .ta.inc{color:var(--inc)}
.tag{display:inline-flex;align-items:center;gap:3px;font:700 10.5px/1 var(--font);padding:3px 6px;border-radius:999px;background:var(--accSoft);color:var(--accInk);margin-left:4px;vertical-align:1px}

/* фільтри операцій */
.fseg{display:flex;gap:4px;margin-top:12px;padding:4px;border-radius:20px}
.fseg button{flex:1;min-width:0;padding:8px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 13px/1.1 var(--font);color:var(--ink2);transition:background .25s,color .25s,transform .3s var(--spring)}
.fseg button small{font:700 11.5px/1 var(--font);color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.fseg button.on{background:var(--gl2);color:var(--ink);box-shadow:0 1px 2px rgba(10,50,40,.08),0 6px 14px -6px rgba(10,70,55,.25)}
.dark .fseg button.on{background:rgba(255,255,255,.12)}
.fseg button.on small{color:var(--ink2)}
.fseg button[data-fk=exp].on small{color:var(--exp)}.fseg button[data-fk=inc].on small{color:var(--inc)}
.fseg button:active{transform:scale(.96)}
.fcat{display:flex;align-items:center;gap:11px;margin-top:10px;border-radius:22px;padding:10px 10px 10px 10px}
.fcat .fm{flex:1;min-width:0}
.fcat b{display:block;font:700 15px/1.2 var(--font)}
.fcat small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.fcat .pill{padding:9px 12px;border-radius:999px;background:var(--accSoft);color:var(--accInk);font:700 12.5px/1 var(--font)}
.fcat .xb{width:34px;height:34px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;color:var(--ink2)}
.fcat .xb svg{width:11px;height:11px}

/* порожньо */
.empty{text-align:center;padding:34px 20px 20px}
.empty .eart{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font-size:44px;animation:float 4s ease-in-out infinite}
.empty h3{margin:0;font:800 20px/1.2 var(--font);letter-spacing:-.03em}
.empty p{margin:8px auto 0;color:var(--ink2);font-size:14px;line-height:1.5;max-width:290px}
.empty .btn{width:auto;display:inline-flex;margin-top:18px;padding:0 22px}

/* підписки */
.shero{margin-top:16px;border-radius:28px;padding:18px 18px 16px;position:relative;overflow:hidden}
.shero .lbl{font:600 13px/1 var(--font);color:var(--ink2)}
.shero .big{font:800 34px/1.05 var(--font);letter-spacing:-.04em;margin-top:8px;font-variant-numeric:tabular-nums}
.shero .big small{font:700 15px/1 var(--font);color:var(--ink2);letter-spacing:-.01em}
.shero .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.shero .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--bg2);font:700 12.5px/1 var(--font);color:var(--ink2)}
.shero .pill b{color:var(--ink);font-variant-numeric:tabular-nums}
.shero .orb{position:absolute;right:-14px;top:-14px;width:110px;height:110px;border-radius:50%;background:radial-gradient(closest-side,var(--accSoft),transparent);display:grid;place-items:center;color:var(--acc);opacity:.9}
.addrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;border-radius:22px;padding:12px 14px 12px 12px}
.addrow .pi{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--fab);color:#fff;box-shadow:var(--fabSh)}
.addrow .pi svg{width:20px;height:20px}
.addrow b{display:block;font:700 15px/1.2 var(--font)}
.addrow span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.sub{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 10px;border-radius:20px;transition:background .2s,transform .3s var(--spring)}
.sub:active{background:var(--bg2);transform:scale(.985)}
.sub+.sub{position:relative}
.sub+.sub:before{content:"";position:absolute;left:66px;right:12px;top:0;height:1px;background:var(--hair)}
.sav{width:44px;height:44px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:21px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));box-shadow:0 6px 14px -6px color-mix(in srgb,var(--c) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.sub .sm{flex:1;min-width:0}
.sub .sm b{display:block;font:700 15px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .sm small{display:block;font:500 12.5px/1.25 var(--font);color:var(--ink2);margin-top:2px}
.sub .sr{text-align:right;flex:none}
.sub .sr b{display:block;font:800 15px/1.2 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.when{display:inline-block;margin-top:4px;font:700 11.5px/1 var(--font);padding:4px 8px;border-radius:999px;background:var(--bg2);color:var(--ink2)}
.when.soon{background:var(--warnSoft);color:var(--warn)}
.when.today{background:var(--fab);color:#fff}
.sub.paused{opacity:.6}
.sub.paused .sav{filter:grayscale(.8)}
.toggle{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:14px;padding:12px;border-radius:18px;font:700 13.5px/1 var(--font);color:var(--ink2)}
.toggle svg{width:16px;height:16px;transition:transform .3s var(--ease)}
.toggle.open svg{transform:rotate(90deg)}

/* цілі */
.goals{display:grid;gap:12px}
.gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:26px;padding:14px 14px 14px 14px;cursor:pointer;transition:transform .35s var(--spring)}
.gcard:active{transform:scale(.98)}
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring svg .rp{transition:stroke-dashoffset 1.1s var(--ease)}
.ring .re{position:relative;font-size:24px;line-height:1}
.ring .rpct{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font:800 10.5px/1 var(--font);padding:3px 6px;border-radius:999px;background:var(--gl2);box-shadow:inset 0 0 0 1px var(--glb),0 2px 6px rgba(0,0,0,.08);white-space:nowrap;font-variant-numeric:tabular-nums}
.gcard .gm{flex:1;min-width:0}
.gcard .gm>b{display:block;font:700 16px/1.2 var(--font);letter-spacing:-.015em}
.gcard .gn{font:600 13px/1.2 var(--font);color:var(--ink2);margin-top:4px;font-variant-numeric:tabular-nums}
.gcard .gn b{color:var(--ink);font-weight:800}
.gcard .gh{font:500 12px/1.35 var(--font);color:var(--accInk);margin-top:6px}
.gcard.done .gh{color:var(--warn);font-weight:700}
.gplus{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accSoft);color:var(--accInk);transition:transform .3s var(--spring)}
.gplus svg{width:18px;height:18px}
.gplus:active{transform:scale(.88)}
.gsum{margin-top:16px;border-radius:28px;padding:18px;display:flex;align-items:center;gap:16px}
.gsum .gt{flex:1;min-width:0}
.gsum .lbl{font:600 13px/1 var(--font);color:var(--ink2)}
.gsum .big{font:800 30px/1.05 var(--font);letter-spacing:-.04em;margin-top:8px;font-variant-numeric:tabular-nums}
.gsum .sub2{font:600 13px/1.3 var(--font);color:var(--ink2);margin-top:6px}

/* нижня панель вкладок */
.fadebot{position:fixed;left:0;right:0;bottom:0;z-index:18;pointer-events:none;height:calc(110px + var(--safeB));background:linear-gradient(color-mix(in srgb,var(--bg) 0%,transparent),color-mix(in srgb,var(--bg) 60%,transparent));-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
.tabbar{position:fixed;left:50%;bottom:calc(12px + var(--safeB));transform:translateX(-50%);z-index:20;width:min(calc(100% - 24px),440px);height:68px;border-radius:28px;display:flex;align-items:center;padding:0 6px;
  background:var(--gl2);box-shadow:inset 0 0 0 1px var(--glb),inset 0 1px 0 rgba(255,255,255,.6),var(--sh2)}
.dark .tabbar{box-shadow:inset 0 0 0 1px var(--glb),inset 0 1px 0 rgba(255,255,255,.06),var(--sh2)}
.tbind{position:absolute;top:7px;left:0;height:54px;width:60px;border-radius:21px;background:var(--accSoft);pointer-events:none;opacity:0}
.tbind.ok{opacity:1}
.tbind.anim{transition:transform .5s var(--spring),width .5s var(--spring)}
.tb{position:relative;z-index:1;flex:1;min-width:0;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 10.5px/1 var(--font);color:var(--ink3);transition:color .25s,transform .3s var(--spring)}
.tb svg{width:24px;height:24px;transition:transform .4s var(--spring)}
.tb.on{color:var(--accInk)}
.dark .tb.on{color:var(--acc)}
.tb.on svg{transform:translateY(-1px) scale(1.06)}
.tb:active{transform:scale(.92)}
.tbadd{position:relative;z-index:2;width:58px;height:58px;flex:none;margin:-30px 4px 0;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--fab);
  box-shadow:var(--fabSh),0 0 0 5px color-mix(in srgb,var(--bg) 80%,transparent);transition:transform .35s var(--spring)}
.tbadd svg{width:26px;height:26px;transition:transform .45s var(--spring)}
.tbadd:active{transform:scale(.9)}
.tbadd:active svg{transform:rotate(90deg)}
.tbadd:after{content:"";position:absolute;inset:-8px;border-radius:50%;z-index:-1;background:radial-gradient(closest-side,var(--glow),transparent);animation:fabGlow 3.6s ease-in-out infinite;pointer-events:none}
@keyframes fabGlow{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1.08)}}

/* поява */
.view.enter>*{animation:rise .55s var(--ease) both}
.view.enter>:nth-child(2){animation-delay:.04s}.view.enter>:nth-child(3){animation-delay:.08s}.view.enter>:nth-child(4){animation-delay:.12s}.view.enter>:nth-child(5){animation-delay:.16s}.view.enter>:nth-child(6){animation-delay:.2s}.view.enter>:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.glass,.btn,.chip,.cc,.kpk{transition:transform .38s var(--spring),box-shadow .3s var(--ease),background-color .25s,filter .25s}
.lim:active,.addrow:active,.limempty:active{transform:scale(.98);filter:brightness(1.03)}
.iconbtn:active{transform:scale(.9)}

/* шторки */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,40,32,.24);opacity:0;transition:opacity .45s var(--ease);}
.dark .veil{background:rgba(0,0,0,.55)}
.veil.on{opacity:1}
.veil.out{pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);background:var(--sheetBg);
  border-radius:32px 32px 0 0;max-height:94vh;max-height:calc(100dvh - 18px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translate3d(0,105%,0);transition:transform .52s cubic-bezier(.32,.72,0,1);
  padding:0 18px calc(22px + var(--safeB));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 -20px 60px -10px rgba(10,60,50,.25);outline:none}
.dark .sheet{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 -20px 60px -10px rgba(0,0,0,.6)}
.sheet.on{transform:none}
.sheet.out{transition:transform .3s cubic-bezier(.4,0,.85,.55);pointer-events:none}
.grab{position:sticky;top:0;z-index:6;margin:0 -18px;height:46px;transition:box-shadow .2s}
.grab.sc{background:var(--sheetBg);box-shadow:0 1px 0 var(--hair)}
.grab i{position:absolute;left:50%;top:8px;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--ink3);opacity:.5}
.grab .x{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--bg2);color:var(--ink2);display:grid;place-items:center}
.grab .x svg{width:11px;height:11px}
.grab .x:after{content:"";position:absolute;inset:-8px}
.sheet h3{font:800 25px/1.15 var(--font);letter-spacing:-.035em;margin:0 0 6px;padding-right:44px}
.ssub{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.45}
.sheet.compact{text-align:center}
.sheet.compact .grab{height:28px}
.sheet.compact .grab .x{display:none}
.sheet.on>:not(.grab){animation:sheetIn .5s var(--ease) both}
.sheet.on>:nth-child(3){animation-delay:.05s}.sheet.on>:nth-child(4){animation-delay:.09s}.sheet.on>:nth-child(n+5){animation-delay:.13s}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* кнопки, поля */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:14px 18px;border-radius:999px;font:700 16px/1.2 var(--font);letter-spacing:-.01em;background:var(--gl2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair),var(--sh1)}
.btn svg{width:19px;height:19px}
.btn:active{transform:scale(.97);filter:brightness(1.05)}
.btn.pri{background:var(--fab);color:#fff;box-shadow:var(--fabSh)}
.btn.del{background:linear-gradient(135deg,#ff7a7a,#e0413a);color:#fff;box-shadow:0 14px 28px -12px rgba(224,65,58,.65),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2)}
.btn.danger{background:transparent;box-shadow:none;color:var(--exp)}
.btn.sm{min-height:44px;font-size:14.5px;padding:10px 16px}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn{flex:1}
.fl{display:flex;align-items:center;gap:6px;font:700 12.5px/1 var(--font);color:var(--ink2);margin:18px 4px 9px;letter-spacing:.01em}
.fl .opt{font-weight:500;color:var(--ink3)}
.inp{width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--fline);background:var(--field);font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--acc2);box-shadow:0 0 0 4px var(--glow)}
.inp::placeholder{color:var(--ink3)}
input[type=date].inp{min-height:50px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:999px;font:600 14px/1 var(--font);background:var(--field);box-shadow:inset 0 0 0 1px var(--fline);color:var(--ink)}
.chip.on{background:var(--accSoft);box-shadow:inset 0 0 0 1.5px var(--acc2);color:var(--accInk);font-weight:700;animation:pop .4s var(--spring)}
.dark .chip.on{color:var(--acc)}
.chip:active{transform:scale(.95)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.seg{display:flex;position:relative;padding:4px;border-radius:999px;background:var(--bg2)}
.seg button{flex:1;position:relative;z-index:1;min-height:40px;border-radius:999px;font:700 14.5px/1 var(--font);color:var(--ink2);transition:color .25s}
.seg button.on{color:var(--ink)}
.seg .si{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--gl2);box-shadow:0 1px 2px rgba(10,50,40,.08),0 6px 14px -6px rgba(10,70,55,.3);transition:transform .45s var(--spring),background .3s}
.dark .seg .si{background:rgba(255,255,255,.14)}
.seg.kind button.on[data-kind=exp]{color:var(--exp)}.seg.kind button.on[data-kind=inc]{color:var(--inc)}
.hint{font:500 12.5px/1.45 var(--font);color:var(--ink2);margin:8px 4px 0}
.box{border-radius:22px;padding:4px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 12px;border-radius:18px;min-height:56px}
.row+.row{box-shadow:0 -1px 0 var(--hair)}
.row:active{background:var(--bg2)}
.row .rm{flex:1;min-width:0}
.row .rm b{display:block;font:700 15px/1.25 var(--font)}
.row .rm small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.row .rv{font:700 14px/1 var(--font);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .rv.set{color:var(--accInk)}
.dark .row .rv.set{color:var(--acc)}
.row .ri{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:18px;background:var(--bg2)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--fline);position:relative;flex:none;transition:background .25s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s var(--spring)}
.sw.on{background:var(--acc)}
.sw.on:after{transform:translateX(20px)}

/* швидке введення */
.fes{padding-bottom:calc(14px + var(--safeB))}
.fes .grab{height:30px}
.fes .grab .x{top:6px}
.fe .seg{margin:0 44px 0 0}
.amt{text-align:center;margin:14px 0 4px;position:relative}
.amtv{display:inline-flex;align-items:baseline;gap:8px;max-width:100%}
.amtn{font:800 48px/1.05 var(--font);letter-spacing:-.05em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.amtn.z{color:var(--ink3)}
.amtn.exp{color:var(--ink)}
.amtn.inc{color:var(--inc)}
.amtc{font:800 22px/1 var(--font);padding:8px 12px;border-radius:999px;background:var(--bg2);color:var(--ink2);display:inline-flex;align-items:center;gap:4px}
.amtc svg{width:12px;height:12px}
.amtx{font:600 13px/1 var(--font);color:var(--ink2);margin-top:6px;min-height:13px}
.amt.shake,.cats.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.curs{display:flex;gap:6px;justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
.curs .chip{min-height:36px;padding:6px 13px;font-size:15px}
.cats{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:max-content;gap:8px;overflow-x:auto;margin:12px -18px 0;padding:2px 18px 4px;scrollbar-width:none;scroll-padding:0 18px}
.cats.one{grid-template-rows:auto}
.cats::-webkit-scrollbar{display:none}
.cc{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 6px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1px var(--fline);font:600 14px/1 var(--font);white-space:nowrap}
.cc span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:color-mix(in srgb,var(--c) 17%,transparent)}
.cc.on{background:color-mix(in srgb,var(--c) 16%,var(--field));box-shadow:inset 0 0 0 1.5px var(--c);font-weight:700;animation:pop .4s var(--spring)}
.cc:active{transform:scale(.95)}
.ferow{display:flex;gap:8px;margin-top:12px;align-items:center}
.ferow .chip{min-height:38px;padding:7px 12px;font-size:13.5px;flex:none}
.dpick{position:relative;overflow:hidden}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.note{margin-top:10px;padding:11px 14px;border-radius:16px;font-size:15px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpk{height:52px;border-radius:18px;font:700 23px/1 var(--font);background:var(--gl2);box-shadow:inset 0 0 0 1px var(--glb),0 1px 2px rgba(10,50,40,.06);font-variant-numeric:tabular-nums;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.dark .kpk{background:rgba(255,255,255,.07)}
.kpk svg{width:24px;height:24px}
.kpk:active{transform:scale(.93);background:var(--accSoft);transition-duration:.08s}
.kpk.bs{background:transparent;box-shadow:none;color:var(--ink2)}
.fe .btns{margin-top:12px}
.fe .btn.sq{flex:none;width:54px;padding:0;color:var(--exp)}

/* налаштування */
.thpick{display:grid;gap:10px}
.thauto{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:11px 14px 11px 11px;border-radius:22px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--glb);transition:box-shadow .25s,background .25s,transform .3s var(--spring)}
.thauto:active{transform:scale(.98)}
.thauto .tha{width:48px;height:48px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:24px;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.thauto .tht{flex:1;min-width:0}
.thauto b{display:block;font-size:15.5px}
.thauto .tht span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.thck{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px var(--fline);display:grid;place-items:center;transition:background .25s,box-shadow .25s,transform .3s var(--spring)}
.thauto.on>.thck,.thsw.on .thck{background:var(--acc);box-shadow:0 3px 10px -2px var(--glow)}
.thauto.on>.thck:after,.thsw.on .thck:after{content:"";width:9px;height:5px;border:2.4px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.thauto.on{box-shadow:inset 0 0 0 2px var(--acc2)}
.thgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.thsw{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:5px 5px 9px;border-radius:22px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--glb);text-align:center;transition:box-shadow .25s,transform .3s var(--spring)}
.thsw:active{transform:scale(.95)}
.thsw.on{box-shadow:inset 0 0 0 2px var(--acc),0 8px 20px -12px var(--acc)}
.thpv{position:relative;height:70px;border-radius:17px;overflow:hidden;display:block;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.thpv .thpe{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:28px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.thpv .thpb{position:absolute;left:9px;bottom:9px;width:44%;height:9px;border-radius:6px;background:var(--swf)}
.thpv .thck{position:absolute;right:6px;top:6px;width:22px;height:22px;box-shadow:none;transform:scale(.4);opacity:0}
.thsw.on .thpv .thck{opacity:1;transform:scale(1)}
.thsw b{font-size:13.5px;line-height:1.1}
.thsw small{font-size:11px;line-height:1;color:var(--ink3);font-weight:600;margin-top:-3px}
.thsw.on b{color:var(--accInk)}
.dark .thsw.on b{color:var(--acc)}
.thhint{font-size:12.5px;color:var(--ink2);margin:2px 4px 0;line-height:1.4}
.t-classic{--sw:radial-gradient(120% 140% at 0% 0%,#a7f3d0 0%,rgba(167,243,208,0) 60%),radial-gradient(120% 140% at 100% 100%,#fde68a 0%,rgba(253,230,138,0) 60%),#e6f7f0;--swf:linear-gradient(135deg,#34d399,#0d9488)}
.t-winter{--sw:radial-gradient(120% 140% at 0% 0%,#d6e4ff 0%,rgba(214,228,255,0) 62%),radial-gradient(120% 140% at 100% 100%,#c7f5ec 0%,rgba(199,245,236,0) 60%),#eff3fd;--swf:linear-gradient(135deg,#60a5fa,#0d9488)}
.t-spring{--sw:radial-gradient(120% 140% at 0% 0%,#ffd3e0 0%,rgba(255,211,224,0) 60%),radial-gradient(120% 140% at 100% 100%,#bfeed9 0%,rgba(191,238,217,0) 62%),#fff5f1;--swf:linear-gradient(135deg,#f590ab,#10b981)}
.t-romance{--sw:radial-gradient(120% 140% at 0% 0%,#ffbccd 0%,rgba(255,188,205,0) 60%),radial-gradient(120% 140% at 100% 100%,#ffdca6 0%,rgba(255,220,166,0) 62%),#ffe2e7;--swf:linear-gradient(135deg,#ec5f86,#c4305c)}
.t-summer{--sw:radial-gradient(120% 140% at 0% 0%,#ffc999 0%,rgba(255,201,153,0) 60%),radial-gradient(120% 140% at 100% 100%,#a5f3fc 0%,rgba(165,243,252,0) 62%),#fff0de;--swf:linear-gradient(135deg,#fbbf24,#14b8a6)}
.t-autumn{--sw:radial-gradient(120% 140% at 0% 0%,#ffcb98 0%,rgba(255,203,152,0) 60%),radial-gradient(120% 140% at 100% 100%,#efbca8 0%,rgba(239,188,168,0) 62%),#fbe6d0;--swf:linear-gradient(135deg,#eb9a42,#0f766e)}
.dark .thpv,.dark .thauto .tha{filter:brightness(.6) saturate(1.2)}
.emos{display:flex;flex-wrap:wrap;gap:6px}
.emos button{width:44px;height:44px;border-radius:14px;font-size:22px;background:var(--field);box-shadow:inset 0 0 0 1px var(--fline);transition:transform .3s var(--spring)}
.emos button.on{box-shadow:inset 0 0 0 2px var(--acc2);background:var(--accSoft);transform:scale(1.06)}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);transition:transform .3s var(--spring)}
.cols button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c);transform:scale(1.05)}
.popgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pop{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 11px;border-radius:20px;font:700 12.5px/1.15 var(--font);text-align:center}
.pop .sav{width:46px;height:46px}
.pop:active{transform:scale(.95)}
.subprev{display:flex;align-items:center;gap:12px;margin:2px 0 4px}
.subprev .sav{width:54px;height:54px;border-radius:18px;font-size:26px}
.gview{text-align:center}
.gview .ring{margin:4px auto 0}
.gview .ring .re{font-size:44px}
.gview h3{padding:0;margin-top:16px}
.gview .gn{font:600 15px/1.3 var(--font);color:var(--ink2);font-variant-numeric:tabular-nums}
.gview .gn b{color:var(--ink);font-size:22px;font-weight:800;letter-spacing:-.03em}
.ghint{margin-top:14px;padding:12px 14px;border-radius:20px;text-align:left;font:600 13.5px/1.4 var(--font);display:flex;gap:10px;align-items:flex-start}
.ghint i{font-style:normal;font-size:18px;line-height:1.2}
.hist{text-align:left;margin-top:6px}
.hist .row{min-height:48px;padding:10px 12px}
.hist .rv.p{color:var(--inc)}.hist .rv.m{color:var(--exp)}
.cfm{padding:0 4px}
.cfmico{width:78px;height:78px;margin:4px auto 14px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--glb),var(--sh2)}
.cfm h3{padding:0}
.cfm p{color:var(--ink2);margin:6px 0 20px;font-size:15px;line-height:1.45}
.cfm .btn+.btn{margin-top:6px}

/* тости */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:80;display:flex;align-items:center;gap:10px;width:max-content;max-width:min(92vw,440px);padding:6px 18px 6px 6px;border-radius:999px;background:rgba(14,32,27,.82);color:#fff;font:600 14.5px/1.3 var(--font);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 18px 40px -12px rgba(10,40,30,.5);transform:translate(-50%,-160%) scale(.92);opacity:0;transition:transform .6s var(--spring),opacity .3s;pointer-events:none}
.dark .toast{background:rgba(240,255,250,.9);color:#0f1f1a}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1}
.toast .ti{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.16)}
.dark .toast .ti{background:rgba(16,185,129,.16)}
.toast.err .ti{background:#e5484d;color:#fff;font:800 17px/1 var(--font)}
.toast .tt{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.conf{position:fixed;left:0;top:0;z-index:90;pointer-events:none;line-height:1;will-change:transform,opacity}

/* заглушки */
.sk{border-radius:22px;background:var(--bg2);position:relative;overflow:hidden}
.sk:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:skm 1.4s infinite}
.dark .sk:after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%)}
@keyframes skm{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.locked{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 10px}
.locked img{width:112px;height:112px;border-radius:36px;box-shadow:0 22px 44px -16px rgba(13,148,136,.6);margin-bottom:22px;animation:float 4s ease-in-out infinite}
.locked h1{font:800 30px/1.1 var(--font);letter-spacing:-.035em;margin:0 0 10px}
.locked p{color:var(--ink2);margin:0 0 24px;font-size:15px;line-height:1.45;max-width:300px}
.lockchip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink2)}
.lockchip svg{width:15px;height:15px;color:var(--acc)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.inp:focus-visible{outline:none}


/* ===== РАХУНКИ, МІСЯЦЬ, БОРГИ, МАЙСТЕР ===== */
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hchip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font:700 12px/1.1 var(--font)}
.accs{display:flex;gap:8px;overflow-x:auto;margin:16px -20px -4px;padding:2px 20px 6px;scrollbar-width:none}
.accs::-webkit-scrollbar{display:none}
.acard{flex:none;min-width:128px;max-width:170px;text-align:left;padding:11px 13px 12px;border-radius:20px;background:rgba(255,255,255,.15);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),inset 0 1px 0 rgba(255,255,255,.25);color:#fff;display:flex;flex-direction:column;gap:2px;transition:transform .35s var(--spring),background .2s}
.acard:active{transform:scale(.95);background:rgba(255,255,255,.24)}
.acard .ae{font-size:20px;line-height:1;margin-bottom:6px}
.acard .an{font:600 12px/1.2 var(--font);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard b{font:800 17px/1.15 var(--font);letter-spacing:-.025em;white-space:nowrap;font-variant-numeric:tabular-nums}
.acard b.neg{color:#ffd1d1}
.acard small{font:600 11px/1.1 var(--font);opacity:.72;font-variant-numeric:tabular-nums}
.acard.add{min-width:92px;align-items:center;justify-content:center;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.acard.add .ae{font-size:22px;margin:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.acard.add .an{opacity:1;margin-top:6px}
.mcard{margin-top:12px;border-radius:26px;padding:16px}
.mc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mc3 span{display:block;font:600 12px/1 var(--font);color:var(--ink2)}
.mc3 b{display:block;font:800 17px/1.15 var(--font);letter-spacing:-.03em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mc3 b.inc{color:var(--inc)}.mc3 b.neg{color:var(--exp)}
.mc3 small{display:block;font:600 10.5px/1.2 var(--font);color:var(--ink3);margin-top:3px;white-space:nowrap}
.mbar{height:8px;border-radius:5px;background:var(--bg2);margin-top:14px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .9s var(--ease)}
.mbar i.warn{background:linear-gradient(90deg,#fcd34d,#f59e0b)}.mbar i.over{background:linear-gradient(90deg,#fb7185,#e5484d)}
.mfoot{font:500 13px/1.4 var(--font);color:var(--ink2);margin-top:9px}
.mfoot b{color:var(--ink);font-weight:800}
.when.late{background:var(--expSoft);color:var(--exp)}
.tx .ta.tr{color:var(--ink2)}
.facc{margin-top:16px;border-radius:26px;padding:14px 14px 12px}
.fat{display:flex;align-items:center;gap:11px}
.fat .ae{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--accSoft);flex:none}
.fat .fm{flex:1;min-width:0}
.fat small{display:block;font:600 12px/1 var(--font);color:var(--ink2)}
.fat b{display:block;font:800 17px/1.2 var(--font);margin-top:3px}
.fab2{font:800 32px/1.1 var(--font);letter-spacing:-.04em;margin:12px 2px 0;font-variant-numeric:tabular-nums}
.fab2.neg{color:var(--exp)}
.fbtns{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pill{padding:9px 12px;border-radius:999px;background:var(--accSoft);color:var(--accInk);font:700 12.5px/1 var(--font)}
.dark .pill{color:var(--acc)}
.xb{width:34px;height:34px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;color:var(--ink2);flex:none}
.xb svg{width:11px;height:11px}
.achips{display:flex;gap:6px;overflow-x:auto;margin:10px -18px 0;padding:2px 18px 4px;scrollbar-width:none}
.achips::-webkit-scrollbar{display:none}
.ach{flex:none;display:inline-flex;align-items:center;gap:8px;padding:6px 13px 6px 7px;border-radius:16px;background:var(--field);box-shadow:inset 0 0 0 1px var(--fline);text-align:left;transition:transform .3s var(--spring)}
.ach>span:first-child{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--bg2)}
.ach b{display:block;font:700 13.5px/1.15 var(--font);white-space:nowrap}
.ach small{display:block;font:600 11px/1.1 var(--font);color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ach.on{background:var(--accSoft);box-shadow:inset 0 0 0 1.5px var(--acc2)}
.ach:active{transform:scale(.95)}
.alab{font:700 12px/1 var(--font);color:var(--ink2);margin:12px 4px -2px}
.fes .alab{margin-top:10px}
.negb.on{background:var(--expSoft);box-shadow:inset 0 0 0 1.5px var(--exp);color:var(--exp)}
.balbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border-radius:18px;text-align:left}
.balbtn span{font:800 20px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.balbtn small{font:700 13px/1 var(--font);color:var(--accInk)}
.dark .balbtn small{color:var(--acc)}
.dtot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.dt{border-radius:24px;padding:15px 14px;text-align:left;position:relative;overflow:hidden}
.dt:active{transform:scale(.97)}
.dt span{display:block;font:700 13px/1 var(--font);color:var(--ink2)}
.dt b{display:block;font:800 25px/1.1 var(--font);letter-spacing:-.04em;margin-top:9px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt.owe b{color:var(--exp)}.dt.lent b{color:var(--inc)}
.dt small{display:block;font:600 11.5px/1.2 var(--font);color:var(--ink3);margin-top:6px}
.dt:after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;opacity:.5}
.dt.owe:after{background:radial-gradient(closest-side,var(--expSoft),transparent)}.dt.lent:after{background:radial-gradient(closest-side,var(--accSoft),transparent)}
.sav.av{border-radius:50%;color:#fff;font:800 18px/1 var(--font)}
.sav.av.big{width:76px;height:76px;font-size:32px;margin:4px auto 0}
.sub .sr b.neg{color:var(--exp)}.sub .sr b.pos{color:var(--inc)}
.dkind{display:inline-block;margin-top:6px;padding:5px 10px;border-radius:999px;font:700 12px/1 var(--font)}
.dkind.owe{background:var(--expSoft);color:var(--exp)}.dkind.lent{background:var(--accSoft);color:var(--inc)}
.dprog{height:8px;border-radius:5px;background:var(--bg2);margin:14px 10px 0;overflow:hidden}
.dprog i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.box .xb{margin-left:auto}
/* майстер */
.wiz{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:14px 0 calc(110px + var(--safeB))}
.wtop{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.wdots{display:flex;gap:6px}
.wdots i{width:8px;height:8px;border-radius:5px;background:var(--fline);transition:width .4s var(--spring),background .3s}
.wdots i.done{background:var(--acc2)}
.wdots i.on{width:26px;background:var(--acc)}
.wskip{font:700 14px/1 var(--font);color:var(--ink2);padding:10px 4px}
.wbody.in>*{animation:rise .5s var(--ease) both}
.wbody.in>:nth-child(2){animation-delay:.05s}.wbody.in>:nth-child(3){animation-delay:.09s}.wbody.in>:nth-child(n+4){animation-delay:.13s}
.wnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safeB));z-index:20;width:min(calc(100% - 24px),440px);display:flex;gap:8px;padding:7px;border-radius:999px;background:var(--gl2);box-shadow:inset 0 0 0 1px var(--glb),var(--sh2)}
.wnav .btn{min-height:52px}
.wnav .wback{flex:0 0 auto;width:auto;padding:0 20px}
.whead{text-align:center;margin:18px 0 18px}
.wemo{display:inline-grid;place-items:center;width:72px;height:72px;border-radius:50%;font-size:34px;background:var(--gl);box-shadow:inset 0 0 0 1px var(--glb),var(--sh2);animation:float 4s ease-in-out infinite}
.wemo.big{width:96px;height:96px;font-size:46px}
.whead h2{margin:14px 0 0;font:800 25px/1.15 var(--font);letter-spacing:-.035em}
.whead p{margin:8px auto 0;color:var(--ink2);font-size:14.5px;line-height:1.45;max-width:330px}
.wwel{text-align:center;padding-top:24px}
.wlogo{width:104px;height:104px;border-radius:34px;box-shadow:0 22px 44px -16px rgba(13,148,136,.6);animation:float 4s ease-in-out infinite}
.wwel h1{font:800 31px/1.1 var(--font);letter-spacing:-.04em;margin:22px 0 0}
.wwel>p{color:var(--ink2);font-size:15.5px;line-height:1.45;margin:10px auto 0;max-width:300px}
.wlist{margin:24px 0 0;border-radius:26px;padding:6px;text-align:left}
.wli{display:flex;align-items:center;gap:12px;padding:10px 10px}
.wli+.wli{box-shadow:0 -1px 0 var(--hair)}
.wli span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--bg2)}
.wli b{font:700 15px/1.2 var(--font)}
.wnote{color:var(--ink3);font:600 12.5px/1.45 var(--font);margin:16px auto 0;text-align:center;max-width:300px}
.wcur{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wc{border-radius:22px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .35s var(--spring),box-shadow .25s}
.wc b{font:800 30px/1 var(--font)}
.wc span{font:600 12.5px/1 var(--font);color:var(--ink2)}
.wc.on{box-shadow:inset 0 0 0 2px var(--acc),0 10px 24px -12px var(--acc);background:var(--accSoft)}
.wc:active{transform:scale(.95)}
.arow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:22px;margin-top:10px}
.aemo{width:46px;height:46px;border-radius:50%;flex:none;font-size:22px;background:var(--bg2);transition:transform .3s var(--spring)}
.aemo:active{transform:scale(.88) rotate(-10deg)}
.am{flex:1;min-width:0}
.ain{width:100%;border:0;background:transparent;font:700 15.5px/1.2 var(--font);color:var(--ink);padding:2px 0;outline:none}
.ain:focus{box-shadow:0 2px 0 var(--acc2)}
.acur{font:600 12px/1 var(--font);color:var(--ink2);padding:5px 0 0}
.acur:disabled{opacity:.6}
.abal{text-align:right;padding:8px 10px;border-radius:14px;background:var(--accSoft);flex:none}
.abal b{display:block;font:800 15.5px/1.1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accInk)}
.dark .abal b{color:var(--acc)}
.abal b.neg{color:var(--exp)}
.abal small{display:block;font:600 10.5px/1 var(--font);color:var(--ink2);margin-top:3px}
.ax{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ink3);background:var(--bg2)}
.ax svg{width:10px;height:10px}
.wpre{margin-top:12px}
.wtotal{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px 16px;border-radius:20px}
.wtotal span{font:600 13.5px/1 var(--font);color:var(--ink2)}
.wtotal b{font:800 20px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.prow{border-radius:24px;padding:14px;margin-top:10px}
.prow+.prow{margin-top:12px}
.ph{display:flex;align-items:center;gap:8px}
.ph .ain{font-size:16.5px}
.pamt{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin-top:10px;padding:13px 14px;border-radius:16px;background:var(--accSoft);text-align:left}
.pamt span{font:800 22px/1 var(--font);letter-spacing:-.03em;color:var(--accInk);font-variant-numeric:tabular-nums}
.dark .pamt span{color:var(--acc)}
.pamt small{font:600 11.5px/1 var(--font);color:var(--ink2)}
.pday{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.pday>span{font:700 13px/1 var(--font);color:var(--ink2)}
.stepper{display:flex;align-items:center;gap:4px;padding:3px;border-radius:999px;background:var(--bg2)}
.stepper button{width:36px;height:36px;border-radius:50%;font:700 20px/1 var(--font);background:var(--gl2);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper button:active{transform:scale(.9)}
.stepper b{min-width:80px;text-align:center;font:800 15px/1 var(--font);font-variant-numeric:tabular-nums}
.prow .achips{margin:8px -14px 0;padding:2px 14px 4px}
.addrow2{display:block;width:100%;margin-top:12px;padding:14px;border-radius:20px;border:1.5px dashed var(--fline);font:700 14px/1 var(--font);color:var(--accInk)}
.dark .addrow2{color:var(--acc)}
.wiz .seg{margin-bottom:12px}
.dform{border-radius:24px;padding:12px;display:grid;gap:8px}
.dfr{display:flex;gap:8px;align-items:center}
.dfr .inp{flex:1;min-width:0}
.dfr .chip{flex:none;min-width:52px;min-height:50px;border-radius:16px;font-size:16px}
.dfr .btn{flex:none;width:auto;padding:0 20px;min-height:50px}
.wsum{margin-top:22px;border-radius:26px;padding:6px;text-align:left}
.wsr{display:flex;align-items:center;gap:12px;padding:12px 10px}
.wsr+.wsr{box-shadow:0 -1px 0 var(--hair)}
.wsr span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--bg2);flex:none}
.wsr b{flex:1;font:700 14.5px/1.2 var(--font)}
.wsr em{font:800 14.5px/1.2 var(--font);font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
html[data-theme=winter] .wiz{padding-top:40px}

/* ===== ДИЗАЙН 3 · ФІНТЕХ (швидкий: без розмиття, суцільні поверхні) ===== */
:root{
  --bg:#f2f4f3;--surface:#ffffff;--surface2:#f7f9f8;--ink:#0c1613;--ink2:#5d6c66;--ink3:#98a6a0;--line:rgba(12,22,19,.07);--hair:rgba(12,22,19,.06);--bg2:rgba(12,40,30,.05);
  --card:#fff;--gl:#fff;--gl2:#fff;--glb:rgba(12,22,19,.045);--field:#f3f6f4;--fline:rgba(12,22,19,.09);
  --sh1:0 1px 2px rgba(16,28,24,.04),0 6px 18px -10px rgba(16,40,32,.14);
  --sh2:0 2px 6px rgba(16,28,24,.05),0 22px 44px -22px rgba(16,40,32,.28);
  --acc:#0f9d77;--acc2:#14b8a6;--accInk:#08765a;--accSoft:rgba(16,185,129,.11);
  --hero:linear-gradient(155deg,#04342c 0%,#075a47 48%,#0c8462 100%);--heroSh:0 24px 48px -24px rgba(4,60,48,.75);
  --sheetBg:#f6f8f7;--m1:rgba(110,231,183,.30);--m2:rgba(153,246,228,.22);--m3:rgba(253,230,138,.0);--m4:rgba(165,214,255,.0);
}
.dark{
  --bg:#090c0b;--surface:#131816;--surface2:#181e1c;--ink:#eef4f1;--ink2:#9aaaa3;--ink3:#5e6d67;--line:rgba(255,255,255,.07);--hair:rgba(255,255,255,.06);--bg2:rgba(255,255,255,.06);
  --card:#131816;--gl:#131816;--gl2:#1b2220;--glb:rgba(255,255,255,.05);--field:#1a201e;--fline:rgba(255,255,255,.09);
  --sh1:0 1px 2px rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6);--sh2:0 2px 6px rgba(0,0,0,.35),0 24px 48px -20px rgba(0,0,0,.75);
  --acc:#34d399;--accInk:#6ee7b7;--accSoft:rgba(52,211,153,.12);
  --hero:linear-gradient(155deg,#032a23 0%,#064c3c 50%,#0a6e53 100%);--heroSh:0 24px 48px -24px rgba(0,0,0,.9);
  --sheetBg:#101513;--m1:rgba(16,185,129,.14);--m2:rgba(20,184,166,.08);--m3:rgba(0,0,0,0);--m4:rgba(0,0,0,0);
}
body:before{inset:0;background:radial-gradient(90% 40% at 15% 0%,var(--m1),transparent 70%),radial-gradient(70% 34% at 100% 6%,var(--m2),transparent 72%),var(--bg)}
.glass{background:var(--surface);box-shadow:0 0 0 1px var(--glb),var(--sh1)}
.dark .glass{box-shadow:0 0 0 1px var(--glb),var(--sh1)}
#app{padding:0 16px calc(112px + var(--safeB))}
/* шапка */
.top{padding:18px 2px 0;gap:12px}
.brand{width:44px;height:44px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(13,148,136,.55),0 0 0 1px rgba(255,255,255,.7) inset}
.hello{font:600 12.5px/1.2 var(--font);color:var(--ink3)}
.top h1{font:800 23px/1.1 var(--font);letter-spacing:-.035em;margin-top:3px}
.iconbtn{width:42px;height:42px;background:var(--surface);box-shadow:0 0 0 1px var(--glb),var(--sh1)}
/* героїчна картка: «аврора» рухається лише transform-ом */
.hero{margin-top:16px;border-radius:28px;padding:20px 20px 18px;background:var(--hero);box-shadow:var(--heroSh),inset 0 1px 0 rgba(255,255,255,.14);color:#fff}
.hero:before,.hero:after{display:none}

const NB = " ";

function makeLocalStore() {
  const KEY = "mn_local_v2";
  try { localStorage.removeItem("mn_demo_db"); } catch (e) {}
  const read = () => LS.get(KEY, null) || { items: {}, meta: {} };
  let subs = [], t = 0;
  const emit = () => { clearTimeout(t); t = setTimeout(() => { const d = read(); subs.forEach((f) => f(d)); }, 0); };
  const write = (fn) => { const d = read(); fn(d); if (!LS.set(KEY, d)) throw new Error("Пам'ять демо-режиму заповнена"); emit(); };
  window.addEventListener("storage", (e) => { if (e.key === KEY) emit(); });
  return {
    mode: "demo",
    start(onData, onStatus) { if (!LS.get(KEY, null)) LS.set(KEY, { items: {}, meta: {} }); subs.push(onData); onStatus("demo"); emit(); },
    async put(it) { write((d) => { d.items[it.id] = clean(it); }); },
    async putMany(arr) { write((d) => arr.forEach((it) => { d.items[it.id] = clean(it); })); },
    async del(id) { write((d) => { delete d.items[id]; }); },
    async saveMeta(p) { write((d) => { d.meta = Object.assign(d.meta || {}, clean(p)); }); },
  };
}
async function makeCloudStore(cfg) {
  const V = "10.12.2";
  const appM = await import("https://www.gstatic.com/firebasejs/" + V + "/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/" + V + "/firebase-firestore.js");
  const app = appM.initializeApp({ apiKey: cfg.k, projectId: cfg.p, authDomain: cfg.p + ".firebaseapp.com" }, "mn");
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache ? fs.persistentLocalCache() : undefined, experimentalAutoDetectLongPolling: true }); } catch (e) { db = fs.getFirestore(app); }
  const L = cfg.l;
  const ref = (c, id) => fs.doc(db, "lists", L, c, id);
  const body = (it) => { const d = clean(it); delete d.id; return d; };
  return {
    mode: "cloud",
    start(onData, onStatus) {
      const st = { items: {}, meta: {} }; let gi = false, gm = false;
      const push = () => { if (gi && gm) onData({ items: st.items, meta: st.meta }); };
      fs.onSnapshot(fs.collection(db, "lists", L, "items"), { includeMetadataChanges: true }, (snap) => {
        if (gi && !snap.docChanges().length) { onStatus(snap.metadata.fromCache ? "cache" : "on"); return; }
        const items = {}; snap.forEach((d) => { items[d.id] = Object.assign({ id: d.id }, d.data()); });
        st.items = items; gi = true; push(); onStatus(snap.metadata.fromCache ? "cache" : "on");
      }, (err) => onStatus("err", err));
      fs.onSnapshot(ref("meta", "main"), (d) => { st.meta = d.exists() ? d.data() : {}; gm = true; push(); }, (err) => { gm = true; push(); onStatus("err", err); });
    },
    async put(it) { await fs.setDoc(ref("items", it.id), body(it)); },
    async putMany(arr) { const b = fs.writeBatch(db); arr.forEach((it) => b.set(ref("items", it.id), body(it))); await b.commit(); },
    async del(id) { await fs.deleteDoc(ref("items", id)); },
    async saveMeta(p) { await fs.setDoc(ref("meta", "main"), clean(p), { merge: true }); },
  };
}

/* ================= автосписання підписок і зарплата (ідемпотентно) ================= */
let charging = false; const chargedIds = new Set();
async function processAuto() {
  if (charging || !S.store || !S.loaded || !S.meta.setupDone) return; charging = true;
  try {
    const t = today(), out = [], newTx = [], da = defAcc();
    for (const s of subsList()) {
      if (s.paused || s.archived || !s.next || !(+s.amt > 0)) continue;
      let n = s.next, guard = 0;
      while (n <= t && guard++ < 120) {
        const id = "auto_" + s.id + "_" + n; // детермінований id — дубль неможливий
        if (!S.items[id] && !chargedIds.has(id)) newTx.push({ id, type: "tx", kind: "exp", amt: +s.amt, cur: s.cur || "€", cat: "subs", note: s.name, date: n, acc: accOf(s.acc) ? s.acc : da ? da.id : "", sub: s.id, auto: 1, createdAt: Date.now() });
        chargedIds.add(id);
        n = addCycle(n, s.cycle, s.anchor);
      }
      if (n !== s.next) out.push(Object.assign({}, s, { next: n }));
    }
    const sal = S.meta.salary; let thru = null, payTx = [];
    if (sal && sal.since) {
      thru = Object.assign({}, sal.thru || {}); const was = JSON.stringify(thru);
      salItems().forEach((x) => {
        let ym = sal.since.slice(0, 7), g = 0;
        while (ym <= t.slice(0, 7) && g++ < 36) {
          const d = payDate(ym, x.day);
          if (d >= sal.since && d <= t && d > (thru[x.id] || "")) {
            const id = "pay_" + x.id + "_" + d;
            if (!S.items[id] && !chargedIds.has(id)) payTx.push({ id, type: "tx", kind: "inc", amt: +x.amt, cur: x.cur || mainCur(), cat: "salary", note: x.name || "Зарплата", date: d, acc: accOf(x.acc) ? x.acc : da ? da.id : "", pay: x.id, auto: 1, createdAt: Date.now() });
            chargedIds.add(id); thru[x.id] = d;
          }
          ym = ymAdd(ym, 1);
        }
      });
      if (JSON.stringify(thru) === was) thru = null;
    }
    const all2 = newTx.concat(payTx, out);
    if (all2.length) await S.store.putMany(all2);
    if (thru) await S.store.saveMeta({ salary: Object.assign({}, sal, { thru }) });
    if (newTx.length === 1) { const x = newTx[0]; toast("Списано: " + x.note + " — " + money(x.amt, x.cur), "🔁"); }
    else if (newTx.length > 1) toast("Автосписання підписок: " + newTx.length, "🔁");
    payTx.forEach((x) => { toast(x.note + ": +" + money(x.amt, x.cur) + " на " + (accOf(x.acc) ? accOf(x.acc).name : "рахунок"), "💼"); });
    if (payTx.length) { SFX.play("chime"); haptic("ok"); }
  } catch (e) { console.warn(e); }
  finally { charging = false; }
}

function goalMove(g, sign) {

    sub: sign > 0 ? "До цілі лишилось " + money(left, g.cur) : "Зараз відкладено " + money(g.saved, g.cur),
    chips: sign > 0 ? [10, 20, 50, 100].concat(left > 0 && left < 100000 ? [Math.round(left * 100) / 100] : []) : null,
    chipFmt: (c) => (sign > 0 && c === Math.round(left * 100) / 100 && ![10, 20, 50, 100].includes(c) ? "Усе: " + money(c, g.cur) : money(c, g.cur)),
    max: sign < 0 ? g.saved : null, ok: sign > 0 ? "Покласти" : "Зняти",
    note: (n) => (n && sign > 0 ? (g.saved + n >= g.target ? "🎉 Цього вистачить, щоб досягти цілі!" : "Буде " + Math.floor(((g.saved + n) / g.target) * 100) + "% цілі") : ""),
    onSave: async (n) => {

      try {

    },
  });
}

function debtRepay(d, full) {
  const left = debtLeft(d), owe = d.dir === "owe";

    title: full ? "Погасити повністю" : owe ? "Я віддав частину" : "Мені повернули частину", sub: esc(d.who) + " · лишилось " + money(left, d.cur), cur: d.cur, value: full ? left : 0, max: left, ok: full ? "Погасити" : "Записати",
    chips: full ? null : [left / 4, left / 2].map((x) => Math.round(x * 100) / 100).filter((x) => x > 0), chipFmt: (c) => money(c, d.cur),
    accPick: owe ? "З якого рахунку" : "На який рахунок",
    note: (n) => (n ? (n >= left - 0.004 ? "Борг буде закрито 🎉" : "Лишиться " + money(left - n, d.cur)) : ""),

      if (acc) out.push({ id: "t_" + uid(), type: "tx", kind: "debt", sign: owe ? -1 : 1, amt: n, cur: d.cur, acc, cat: "debt", note: (owe ? "Віддав борг: " : "Повернули борг: ") + d.who, debt: d.id, date: today(), createdAt: Date.now() });

}

/* ================= події ================= */
document.addEventListener("click", (e) => {
  const app = $("#app"); if (!app.contains(e.target) && !e.target.closest("#tabbar")) return;
  if (wizActive()) return wizClick(e);
  let b;
  if ((b = e.target.closest("[data-tab]"))) return setTab(b.dataset.tab);
  if (e.target.closest("#fab")) { haptic("medium"); SFX.play("pop"); return openTx(); }
  if ((b = e.target.closest("[data-m]"))) return setMonth(ymAdd(S.month, +b.dataset.m));
  if ((b = e.target.closest("[data-tx]"))) { haptic("light"); return openTx(S.items[b.dataset.tx]); }
  if ((b = e.target.closest("[data-sub]"))) { haptic("light"); return openSub(S.items[b.dataset.sub]); }
  if ((b = e.target.closest("[data-debt]"))) { haptic("light"); return openDebtView(b.dataset.debt); }
  if ((b = e.target.closest("[data-acc]"))) { haptic("light"); S.filter = { kind: "all", cat: null, acc: b.dataset.acc }; UI.enter = true; return S.tab === "ops" ? render() : setTab("ops"); }

  if ((b = e.target.closest("[data-lim]"))) { haptic("light"); return setLimit(b.dataset.lim); }
  if ((b = e.target.closest("[data-go]"))) { S.filter = { kind: b.dataset.go ? "exp" : "all", cat: b.dataset.go || null, acc: null }; return setTab("ops"); }
