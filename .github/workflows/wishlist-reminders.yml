name: Вишлист — напоминания о датах
on:
  schedule:
    - cron: "7 8 * * *"   # каждый день ≈ 9:07 по Амстердаму зимой
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/wishlist_remind.py
        env:
          WL_LINK: ${{ secrets.WL_LINK }}
