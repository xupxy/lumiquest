<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LumiQuest — modes demo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin: 0; height: 100%; background: #1f1630; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #root { max-width: 480px; margin: 0 auto; height: 100%; position: relative; overflow-y: auto; }
  .demo-menu { padding: 16px; display: grid; gap: 10px; }
  .demo-menu button { font-size: 17px; padding: 14px; border-radius: 14px; border: 0; background: #6b4fd8; color: #fff; }
  .demo-menu pre { font-size: 11px; white-space: pre-wrap; color: #cbb; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
// Тестова сторінка для екранів режимів (story / arena / dragons / durak).
// ?screen=arena&wid=w1&preset=rich  — одразу відкрити екран.
const qs = new URLSearchParams(location.search);
const KEY = 'lq_modes_demo_state';
const content = await (await fetch('../content.json')).json();
const S = await import('../js/state.js');
S.setContent?.(content);

function defaults() {
  return {
    name: 'Тестер', xp: 0, fireflies: 0, food: 0, trophies: 0, streak: 1,
    badges: [], unlocked: ['w1'], stars: {}, story_best: {}, story_badges: [],
    dragons: { sun: 0 }, active_dragon: 'sun', durak_wins: 0, durak_games: 0,
  };
}
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || defaults();
const preset = qs.get('preset');
if (preset) {
  state = defaults();
  if (preset === 'rich') {
    Object.assign(state, { food: 200, trophies: 95, unlocked: ['w1', 'w2', 'w3'], badges: ['w1', 'w2'],
      dragons: { sun: 25, forest: 0, clock: 95 }, xp: 340 });
  }
  if (preset === 'all') {
    state.unlocked = ['w1', 'w2', 'w3', 'w4', 'w5'];
    state.dragons = { sun: 480, forest: 240, clock: 100, crystal: 30, sky: 0 };
    state.food = 50; state.trophies = 890;
  }
}
if (preset && preset !== 'new') for (const w of content.WORLDS) if (state.unlocked.includes(w.id)) for (const q of w.quests) state.stars[q.id] = 3;
if (S.sanitize) state = S.sanitize(state);
const screens = ['story', 'arena', 'dragons', 'durak'];
const root = document.getElementById('root');
let cleanup = null;
const hist = [];

const tg = {
  haptic(kind) { window.__haptics = (window.__haptics || []).concat(kind); },
  impact(kind) { this.haptic(kind || 'light'); },
  notify(kind) { this.haptic(kind); },
};

const app = {
  content, state, tg, lumi: null,
  save() { localStorage.setItem(KEY, JSON.stringify(app.state)); window.__saved = (window.__saved || 0) + 1; },
  async go(name, params = {}) {
    hist.push([name, params]);
    window.__lastGo = { name, params };
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
    root.innerHTML = '';
    if (screens.includes(name)) {
      const mod = await import(`../js/screens/${name}.js`);
      cleanup = mod.render(root, params, app) || null;
    } else {
      menu(`→ go("${name}", ${JSON.stringify(params)})`);
    }
  },
  back() { hist.pop(); const p = hist.pop(); if (p) app.go(p[0], p[1]); else { root.innerHTML = ''; menu('back()'); } },
};
window.app = app;

function menu(note = '') {
  const d = document.createElement('div');
  d.className = 'demo-menu';
  d.innerHTML = `<pre>${note}\n${JSON.stringify(app.state)}</pre>`;
  const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; d.append(b); };
  for (const w of content.WORLDS) btn(`💌 Історія ${w.id}`, () => app.go('story', { wid: w.id }));
  for (const w of content.WORLDS) btn(`⚔️ Арена ${w.id}`, () => app.go('arena', { wid: w.id }));
  btn('🐉 Дракони', () => app.go('dragons', {}));
  btn('🃏 Картярня', () => app.go('durak', {}));
  btn('♻️ Скинути стан', () => { localStorage.removeItem(KEY); location.search = ''; });
  root.append(d);
}

const s = qs.get('screen');
if (s) app.go(s, qs.get('wid') ? { wid: qs.get('wid') } : {});
else menu();
</script>
</body>
</html>
