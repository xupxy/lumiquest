<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LumiQuest</title>
<style>html,body{height:100%;margin:0;background:#e9dcff;display:grid;place-items:center;font:600 18px system-ui;color:#3a2433}</style>
</head><body><div>✨ LumiQuest…</div>
<script>
(function () {
  var fallback = "20261112121327";
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  function go(v) { location.replace("v" + v + "/index.html" + location.search + location.hash); }
  var done = false, t = setTimeout(function () { if (!done) { done = true; go(fallback); } }, navigator.onLine === false ? 10 : 4000);
  fetch("version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!done) { done = true; clearTimeout(t); go(j.v || fallback); } })
    .catch(function () { if (!done) { done = true; clearTimeout(t); go(fallback); } });
})();
</script></body></html>
