/* ---- разбор ссылок и валют ---- */
function extractUrl(t) {
  t = String(t || ""); const m = t.match(/https?:\/\/[^\s<>"'«»]+/i) || t.match(/\b(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|ua|ru|nl|de|fr|it|es|eu|pl|uk|net|org|shop|store|io|me|by|kz|co)(?:\/[^\s<>"'«»]*)?/i);
  return m ? m[0].replace(/[).,!?]+$/, "") : "";
}
function curFromText(t) {
  t = String(t || "");
  return /₴|грн|uah/i.test(t) ? "₴" : /€|eur/i.test(t) ? "€" : /₽|руб|rub/i.test(t) ? "₽" : /zł|pln|злот/i.test(t) ? "zł" : /£|gbp/i.test(t) ? "£" : /\$|usd|долл/i.test(t) ? "$" : "";
}
function curFromDomain(u) {
  const m = String(u || "").toLowerCase().match(/^(?:https?:\/\/)?([^\/?#]+)/); if (!m) return "";
  const h = m[1];
  if (/\.ua$|\/ua\b/.test(h) || /rozetka|prom\.ua|kasta|makeup\.com\.ua/.test(h)) return "₴";
  if (/\.ru$/.test(h)) return "₽"; if (/\.pl$/.test(h)) return "zł"; if (/\.co\.uk$|\.uk$/.test(h)) return "£";
  if (/\.(nl|de|fr|it|es|eu|be|at|ie|pt|fi)$/.test(h) || /bol\.com|zalando/.test(h)) return "€";
  const path = String(u).toLowerCase(); if (/\/uk-ua\/|\/ua\/|\/ua-/.test(path)) return "₴"; if (/\/nl\/|\/de\/|\/nl-|\/de-/.test(path)) return "€";
  return "";
}

})();

    wish(it, photo) { if (!isOwner()) return; const c = CATS[it.cat] || CATS[2]; const pr = priceStr(it).replace(/&[^;]+;/g, "");
      send("💝 <b>" + escH(herName()) + " добавила желание</b>\n\n<b>" + escH(it.title) + "</b>\n" + c.emo + " " + c.name + (pr ? " · " + escH(pr) : "") + (it.note ? "\n<i>" + escH(it.note).slice(0, 300) + "</i>" : ""), photo); },

    const r = e.target.closest("[data-rx]");
    if (r) { pick = r.dataset.rx; sh.querySelectorAll(".rbtn").forEach((b) => b.classList.toggle("on", b === r)); haptic("light"); SFX.play("tick"); return; }
    const sb = e.target.closest("#rx_send"); if (!sb) return;
    const t = $("#rx_t", sh).value.trim();
    if (!pick && !t) { toast("Выбери реакцию или напиши пару слов 🙂"); haptic("error"); return; }
    const rr = REACTS.find((x) => x[0] === pick) || ["💌", "Пишет"];
    const reply = { r: rr[0], l: rr[1], t, at: Date.now(), for: at };
    try { heartsFrom(sb, 10); SFX.play("heart"); await S.store.saveMeta({ moodReply: reply, moodSeenAt: Date.now() }); NOTIFY.toOwner("💬 <b>" + NOTIFY.escH(HIM) + " ответил на твою мысль:</b>\n" + rr[0] + " " + NOTIFY.escH(rr[1]) + (t ? "\n<i>«" + NOTIFY.escH(t) + "»</i>" : "")); haptic("ok"); closeSheet(); toast("Отправлено 💌"); }
    catch (err) { toast("Ошибка: " + (err.message || err)); }
  });
}

/* ================= ПРАЗДНИКИ ================= */
function parseDM(v) { const m = String(v || "").match(/(\d{1,2})\s*[.\/\- ]\s*(\d{1,2})/); if (!m) return null; const d = +m[1], mo = +m[2]; return d >= 1 && d <= 31 && mo >= 1 && mo <= 12 ? { d, m: mo } : null; }
function festive() {
  const n = new Date(), d = n.getDate(), m = n.getMonth() + 1, own = isOwner(), her = herName();
  const bd = parseDM((S.meta.about || {}).bday);
  if (bd && bd.d === d && bd.m === m) return own ? { k: "bd", cls: "", e: "🎂", b: "С днём рождения, " + her + "!", t: "Пусть сбудется всё из этого списка — и даже больше 💗" } : { k: "bd", cls: "", e: "🎂", b: "Сегодня день рождения " + herGen() + "!", t: "Поздравь её первым — и загляни в «Я дарю» 🎁" };
  if (!own) { const an = (SPY.dates || []).find((x) => /годовщ/i.test(x.title) && x.d === d && x.m === m); if (an) return { k: "an", cls: "val", e: "💍", b: "Сегодня ваша годовщина!", t: "Самое время сказать ей что-то тёплое 💗" }; }
  if ((m === 12 && d === 31) || (m === 1 && d <= 2)) return { k: "ny", cls: "ny", e: "🎄", b: "С Новым годом!", t: own ? "Пусть в новом году сбудутся все твои желания ✨" : "Пусть в этом году у неё сбудется всё из списка ✨" };
  if (m === 2 && d === 14) return { k: "val", cls: "val", e: "💘", b: "С Днём влюблённых!", t: own ? "Ты самая любимая 💕" : "Не забудь — сегодня её день тоже 💕" };
  if (m === 3 && d === 8) return { k: "mar", cls: "mar", e: "🌷", b: own ? "С 8 Марта, " + her + "!" : "Сегодня 8 Марта", t: own ? "Весны, цветов и сбывшихся желаний 🌸" : "Цветы и поздравление — обязательно 🌷" };
  return null;
}
function festHtml() {
  const f = festive(); if (!f) return "";
  const key = "wl_fest_" + f.k + "_" + new Date().toDateString();
  if (!LS.get(key, false)) { LS.set(key, true); setTimeout(() => { confetti(); SFX.play("tada"); haptic("ok"); }, 700); }
  return '<div class="fest ' + f.cls + '"><b>' + esc(f.b) + "</b><span>" + esc(f.t) + "</span><i>" + f.e + "</i></div>";
}

/* ================= новые желания вживую ================= */
function onData(d) {
  const prevKnown = S.knownIds, prevItems = S.items;
  S.items = d.items || {}; S.meta = d.meta || {}; S.loaded = true;
  const ids = Object.keys(S.items);
  if (prevKnown && !isOwner()) {
    const fresh = ids.filter((id) => !prevKnown.has(id));
    if (fresh.length) { S.flash = new Set(fresh); setTimeout(() => { S.flash = null; }, 2600); SFX.play("chime"); }
    if (fresh.length === 1) { toast("✨ Новое желание: " + S.items[fresh[0]].title); haptic("ok"); }
    else if (fresh.length > 1) { toast("✨ Новых желаний: " + fresh.length); haptic("ok"); }
  }
  if (!isOwner() && !LS.get(K("seen_v2"), false)) {
    S.seen = S.seen || {}; const t = Date.now(); ids.forEach((id) => { if (S.seen[id] == null) S.seen[id] = t; });
    saveSeen(); LS.set(K("seen_v2"), true);
  }
  if (prevKnown && !isOwner()) {
    ids.forEach((id) => { const a = prevItems[id], b = S.items[id]; if (a && b && G(id) && !a.done && b.done) { toast("🎉 " + herName() + " отметила «" + b.title + "» подаренным — это от тебя?"); haptic("ok"); } });
  }
  S.knownIds = new Set(ids);
  migrateGifts();
  if (!isOwner() && S.meta.mood && (S.meta.moodSeenAt || 0) < (S.meta.moodAt || 0) && !document.hidden && S.store) S.store.saveMeta({ moodSeenAt: Date.now() }).catch(() => {});
  if (isOwner() && S.knownReply != null && S.meta.moodReply && S.meta.moodReply.at > S.knownReply) { toast(S.meta.moodReply.r + " " + HIM + ": " + S.meta.moodReply.l + (S.meta.moodReply.t ? " — «" + S.meta.moodReply.t + "»" : "")); SFX.play("chime"); haptic("ok"); }
  S.knownReply = S.meta.moodReply ? S.meta.moodReply.at : 0;
  if (!isOwner() && tgUser && tgUser.id && S.meta.bot && S.meta.viewerId !== tgUser.id && S.store) S.store.saveMeta({ viewerId: tgUser.id }).catch(() => {});
  const bIds = Object.keys(S.meta.bring || {});
  if (S.knownBring && !isOwner()) {
    const nb = bIds.filter((id) => !S.knownBring.has(id) && S.meta.bring[id] && S.meta.bring[id].by === "owner");
    if (nb.length) { toast("🧺 " + herName() + " просит привезти: " + nb.map((id) => S.meta.bring[id].t).join(", ")); haptic("ok"); }
  }
  S.knownBring = new Set(bIds);
  render();
  sheets.forEach((e) => { if (e.sh._redraw && !(document.activeElement && document.activeElement.id === "br_txt")) e.sh._redraw(); });
}

/* ================= старт ================= */
function renderLocked() {
  $("#app").className = "";
  $("#app").innerHTML = '<div class="welcome"><div class="hero"><img src="logo.svg" alt=""></div><h1>Доступ закрыт</h1><p>' +
    (inTg ? "Этот вишлист приватный — он только для двоих." : "Открой вишлист через Telegram-бота.") + '</p><span class="lockchip">' + IC.lock + "Только для своих</span></div>";
}
(async function boot() {
  if (!ALLOWED) { try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {} renderLocked(); return; }
  if (!S.seen && S.role === "viewer") { S.seen = {}; saveSeen(); }
  if (S.role === "viewer") loadSpy();
  try {
    if (tg) { tg.ready(); try { tg.expand(); } catch (e) {} }
    const dark = tg && tg.colorScheme === "dark";
    if (dark) document.documentElement.classList.add("dark");
    applyTheme();
    const bg = dark ? "#1b1418" : "#fbf4ef";
    try { if (tg && tg.setHeaderColor) tg.setHeaderColor(bg); if (tg && tg.setBackgroundColor) tg.setBackgroundColor(bg); } catch (e) {}
    try { if (tg && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  } catch (e) {}

  render();
  try {
    S.store = CFG ? await makeCloudStore(CFG) : makeLocalStore();
    S.status = CFG ? "cache" : "demo";
  } catch (e) {
    console.error(e); S.store = makeLocalStore(); S.status = "demo";
    toast("Не удалось подключиться к облаку — открыт демо-режим");
  }
  S.store.start(onData, (st, err) => {
    S.status = st;
    if (st === "err") { console.error(err); toast(err && err.code === "permission-denied" ? "База не пускает: проверь правила Firestore" : "Нет связи с базой"); }
    const dot = $(".sync"); if (dot) render();
  });
  if (!S.role) render();
  // если открыла хозяйка из Telegram — запомним имя
  setTimeout(() => {
    if (isOwner() && tgUser && S.loaded && S.meta.ownerId !== tgUser.id) S.store.saveMeta({ ownerId: tgUser.id }).catch(() => {});
  }, 1500);
})();
</script>
