<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf4ef">
<title>Вишлист 💗</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:"WInter";src:url(inter-medium-cyr.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"WInter";src:url(inter-bold-cyr.woff) format("woff");font-weight:700;font-display:swap}
@font-face{font-family:"WInter";src:url(inter-extrabold-cyr.woff) format("woff");font-weight:800;font-display:swap}
:root{
  --bg:#fbf4ef;--bg2:#f5e9e2;--card:#fff;--ink:#2e1d27;--ink2:#7a6470;--ink3:#b5a2ab;--line:#efe2db;
  --rose:#e2537a;--rose2:#ff8fab;--roseSoft:#ffe4ec;
  --c1:#ff5f4a;--c1s:#ffe7e2;--c2:#3fae86;--c2s:#ddf4ea;--c3:#8f6bf0;--c3s:#ece6ff;
  --shadow:0 6px 24px rgba(120,60,80,.10),0 1px 3px rgba(120,60,80,.06);
  --r:22px;--safeB:env(safe-area-inset-bottom,0px);
  --font:"WInter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
.dark{
  --bg:#1b1418;--bg2:#251b21;--card:#2a2026;--ink:#f7ecf0;--ink2:#c2aab5;--ink3:#7e6872;--line:#3a2d34;
  --roseSoft:#4a2533;--c1s:#4a2622;--c2s:#1d3a30;--c3s:#30274f;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
.hidden{display:none!important}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(110px + var(--safeB))}

/* ===== MAIN SCREEN (header, mood, tabs, cards, empty, FAB) ===== */
:root{--ease:cubic-bezier(.22,.9,.3,1);--spring:cubic-bezier(.34,1.4,.5,1);--cardShadow:0 1px 2px rgba(120,60,80,.06),0 10px 26px -14px rgba(150,60,90,.28);--glass:rgba(255,255,255,.82)}
.dark{--cardShadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6);--glass:rgba(42,32,38,.78)}

/* header */
.top{padding:20px 2px 0;display:flex;align-items:center;gap:12px}
.brand{width:48px;height:48px;border-radius:16px;flex:none;overflow:hidden;box-shadow:0 8px 20px -8px rgba(226,83,122,.55),0 0 0 1px rgba(255,255,255,.6) inset;background:#ffe6d6}
.brand img{width:100%;height:100%;display:block}
.ttl{flex:1;min-width:0}
.hello{font:600 12.5px/1.2 var(--font);color:var(--rose);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{margin:3px 0 0;font:700 27px/1.08 var(--serif);letter-spacing:-.4px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--cardShadow);display:grid;place-items:center;flex:none;color:var(--ink2);transition:transform .2s var(--ease)}
.iconbtn svg{width:21px;height:21px}
.iconbtn:active{transform:scale(.92)}
.stats{display:flex;align-items:center;gap:8px;margin:14px 2px 0;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:700}
.stats .sep{width:3px;height:3px;border-radius:50%;background:var(--ink3)}
.stats .gifted{color:var(--rose)}
.stats .gifted b{color:var(--rose)}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--font);color:var(--ink2);padding:6px 10px 6px 8px;border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgba(120,60,80,.06)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none}
.dot.on{background:#35c47a;animation:pulse 2.2s infinite}
.dot.err{background:#ff5f4a}
.dot.wait{background:#f0b44a;animation:blink 1.2s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,196,122,.55)}70%{box-shadow:0 0 0 7px rgba(53,196,122,0)}100%{box-shadow:0 0 0 0 rgba(53,196,122,0)}}
@keyframes blink{50%{opacity:.35}}

/* banner (demo) */
.banner{margin:14px 0 0;padding:11px 12px;border-radius:18px;background:var(--card);box-shadow:var(--cardShadow);display:flex;gap:11px;align-items:center;font-size:12.5px;line-height:1.3;color:var(--ink2);width:100%;text-align:left}
.banner .bi{width:34px;height:34px;border-radius:11px;background:var(--bg2);display:grid;place-items:center;flex:none;color:var(--ink2)}
.banner .bi svg{width:19px;height:19px}
.banner b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:1px}
.banner .go{margin-left:auto;color:var(--rose);font-weight:800;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:2px}
.banner .go svg{width:15px;height:15px}

/* mood */
.mood{margin:14px 0 4px;border-radius:24px;padding:16px 18px 15px;position:relative;overflow:hidden;text-align:left;width:100%;display:block;isolation:isolate;
  background:radial-gradient(120% 140% at 0% 0%,#ffd6e2 0%,rgba(255,214,226,0) 60%),radial-gradient(120% 140% at 100% 100%,#e9ddff 0%,rgba(233,221,255,0) 60%),#ffe9dc;
  box-shadow:0 12px 30px -18px rgba(226,83,122,.55),0 0 0 1px rgba(255,255,255,.55) inset}
.dark .mood{background:radial-gradient(120% 140% at 0% 0%,#4f2436 0%,rgba(79,36,54,0) 60%),radial-gradient(120% 140% at 100% 100%,#352a55 0%,rgba(53,42,85,0) 60%),#3a2a2a;box-shadow:0 12px 30px -18px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05) inset}
.mood:before{content:"\201C";position:absolute;right:10px;top:-22px;font:700 130px/1 var(--serif);color:var(--rose);opacity:.13;z-index:-1;pointer-events:none}
.mood .mh{display:flex;align-items:center;gap:8px}
.mood .lbl{font:800 10.5px/1 var(--font);letter-spacing:.13em;text-transform:uppercase;color:var(--rose)}
.mood .when{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font:600 11.5px/1 var(--font);color:var(--ink2)}
.mood .when:before{content:"";width:14px;height:1.5px;border-radius:1px;background:var(--rose);opacity:.6}
.mood .txt{font:600 18px/1.36 var(--serif);margin-top:9px;color:var(--ink);white-space:pre-wrap;word-break:break-word;letter-spacing:-.1px}
.mood .txt.plh{color:var(--ink2);font-style:italic;font-weight:500;font-size:16.5px}
.mood .medit{position:absolute;right:12px;bottom:12px;width:30px;height:30px;border-radius:50%;background:var(--glass);display:grid;place-items:center;color:var(--rose);box-shadow:0 2px 8px rgba(150,60,90,.15)}
.mood .medit svg{width:15px;height:15px}
.mood.own .txt{padding-right:30px}
.mood:active{transform:scale(.985)}
.mood{transition:transform .2s var(--ease)}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin:0 -16px;padding:14px 16px 10px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,rgba(0,0,0,0));scroll-padding:0 40px}
.dark .tabs{background:linear-gradient(var(--bg) 82%,rgba(27,20,24,0))}
.tabs::-webkit-scrollbar{display:none}
.tabrail{position:relative;display:flex;gap:2px;flex:none}
.tab{position:relative;z-index:1;flex:none;padding:9px 13px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;transition:color .3s var(--ease);white-space:nowrap}
.tab b{font-weight:800;font-size:11px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;color:var(--ink2);transition:background .3s,color .3s}
.dark .tab b{background:var(--card)}
.tab.on{color:var(--bg)}
.tab.on b{background:rgba(255,255,255,.2);color:var(--bg)}
.dark .tab.on b{background:rgba(0,0,0,.14)}
.tabind{position:absolute;left:0;top:0;height:100%;width:60px;border-radius:999px;background:var(--ink);box-shadow:0 6px 16px -6px rgba(46,29,39,.55);transform-origin:0 0;pointer-events:none}
.tabind.anim{transition:transform .42s var(--ease),width .42s var(--ease)}
.tabs.noind .tab.on{background:var(--ink)}

/* sections */
.sec{margin-top:16px}
.sechead{display:flex;align-items:center;gap:11px;margin:0 2px 11px}
.sico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.k1 .sico,.sico.k1{background:var(--c1s)}.sico.k2{background:var(--c2s)}.sico.k3{background:var(--c3s)}
.sechead .st{flex:1;min-width:0}
.sechead h2{margin:0;font:700 20px/1.1 var(--serif);letter-spacing:-.2px}
.sechead p{margin:3px 0 0;font-size:12.5px;color:var(--ink2)}
.sechead .sn{font:800 12px/1 var(--font);color:var(--ink3);padding:6px 9px;border-radius:999px;border:1.5px solid var(--line)}
.sec + .sec{margin-top:26px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border-radius:22px;box-shadow:var(--cardShadow);overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative;padding:5px;transition:transform .25s var(--ease),box-shadow .25s}
.card:active{transform:scale(.97)}
.cm{position:relative;aspect-ratio:1/1;border-radius:17px;overflow:hidden;background:var(--bg2)}
.cm img{width:100%;height:100%;object-fit:cover;display:block}
.cm:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(46,29,39,.05);pointer-events:none}
.cm.nop{display:grid;place-items:center}
.cm.nop.k1{background:radial-gradient(90% 80% at 30% 20%,#fff3ee 0%,rgba(255,243,238,0) 70%),linear-gradient(150deg,#ffd9cf,#ffc4b8)}
.cm.nop.k2{background:radial-gradient(90% 80% at 30% 20%,#f1fbf6 0%,rgba(241,251,246,0) 70%),linear-gradient(150deg,#d3f1e3,#b4e5cf)}
.cm.nop.k3{background:radial-gradient(90% 80% at 30% 20%,#f7f3ff 0%,rgba(247,243,255,0) 70%),linear-gradient(150deg,#e3daff,#cfc1ff)}
.dark .cm.nop.k1{background:radial-gradient(90% 80% at 30% 20%,rgba(255,140,120,.18) 0%,rgba(0,0,0,0) 70%),linear-gradient(150deg,#4d2a26,#3a2220)}
.dark .cm.nop.k2{background:radial-gradient(90% 80% at 30% 20%,rgba(110,220,170,.14) 0%,rgba(0,0,0,0) 70%),linear-gradient(150deg,#23463a,#1c3129)}
.dark .cm.nop.k3{background:radial-gradient(90% 80% at 30% 20%,rgba(170,140,255,.18) 0%,rgba(0,0,0,0) 70%),linear-gradient(150deg,#3a2f61,#2a2443)}
.cm .ini{font:italic 700 66px/1 var(--serif);letter-spacing:-2px;opacity:.9;transform:translateY(-4px)}
.k1 .ini{color:#f0725e}.k2 .ini{color:#3fa27e}.k3 .ini{color:#8a68e8}
.dark .k1 .ini{color:#ff8e7c}.dark .k2 .ini{color:#5fcfa3}.dark .k3 .ini{color:#ad92ff}
.cm .wm{position:absolute;right:9px;bottom:8px;font-size:16px;opacity:.75}
.cbody{padding:9px 7px 6px;display:flex;flex-direction:column;flex:1;gap:8px}
.ctitle{font-weight:700;font-size:14px;line-height:1.3;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;color:var(--ink)}
.cfoot{margin-top:auto;display:flex;align-items:center;gap:6px;min-height:22px}
.cprice{display:inline-flex;align-items:center;font:800 12px/1 var(--font);padding:5px 8px;border-radius:999px;letter-spacing:.01em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.card.k1 .cprice{background:var(--c1s);color:#d9473a}.card.k2 .cprice{background:var(--c2s);color:#2a8f69}.card.k3 .cprice{background:var(--c3s);color:#7552d8}
.dark .card.k1 .cprice{color:#ff9282}.dark .card.k2 .cprice{color:#6fd6ad}.dark .card.k3 .cprice{color:#b49cff}
.cnop{font-size:11.5px;color:var(--ink3);font-weight:600}
.cago{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:600;white-space:nowrap}
.badge{position:absolute;top:7px;left:7px;padding:5px 8px 5px 7px;border-radius:999px;font:800 10px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;background:var(--rose);color:#fff;box-shadow:0 4px 12px -2px rgba(226,83,122,.55);display:flex;align-items:center;gap:5px}
.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1.6s ease-in-out infinite}
.badge.upd{background:#8f6bf0;box-shadow:0 4px 12px -2px rgba(143,107,240,.55)}
.badge.upd:before{animation:none;opacity:.8}
.gift{position:absolute;bottom:7px;left:7px;padding:5px 8px;border-radius:999px;font:800 10.5px/1 var(--font);background:var(--glass);color:var(--rose);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(46,29,39,.15)}
.card.gifted{box-shadow:0 0 0 2px var(--rose2),var(--cardShadow)}
.multi{position:absolute;bottom:7px;right:7px;padding:4px 7px;border-radius:999px;font:800 10.5px/1 var(--font);background:rgba(30,18,24,.5);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;gap:4px}
.multi svg{width:11px;height:11px}
.card.done .cm img{filter:saturate(.55) brightness(1.03)}
.card.done .ctitle{color:var(--ink2)}
.donechip{position:absolute;bottom:7px;left:7px;padding:5px 9px 5px 7px;border-radius:999px;background:#2fb078;color:#fff;font:800 10.5px/1 var(--font);display:flex;align-items:center;gap:4px;box-shadow:0 4px 12px -3px rgba(47,176,120,.6)}
.donechip svg{width:11px;height:11px}

/* entrance: first paint + tab switch only */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.intro .card,.intro .sechead{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 160ms - var(--el,0ms))}
.intro .top,.intro .stats,.intro .banner,.intro .mood,.intro .tabs,.intro .empty{animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--d,0ms) - var(--el,0ms))}
.intro .stats{--d:40ms}.intro .banner{--d:70ms}.intro .mood{--d:100ms}.intro .tabs{--d:130ms}.intro .empty{--d:170ms}
.swap .sec,.swap .empty{animation:fadeUp .32s var(--ease) both}

/* skeleton */
.sk{background:var(--bg2);border-radius:12px;position:relative;overflow:hidden}
.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shim 1.3s ease-in-out infinite}
.dark .sk:after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
@keyframes shim{to{transform:translateX(100%)}}
.skcard{background:var(--card);border-radius:22px;padding:5px;box-shadow:var(--cardShadow)}
.skcard .sk:first-child{aspect-ratio:1/1;border-radius:17px}

/* empty */
.empty{text-align:center;padding:38px 26px 30px;color:var(--ink2);font-size:14px;line-height:1.45}
.empty .eart{width:112px;height:112px;margin:0 auto 18px;position:relative;display:grid;place-items:center}
.empty .eart:before{content:"";position:absolute;inset:0;border-radius:36px;background:var(--roseSoft);transform:rotate(-8deg)}
.empty .eart.k1:before{background:var(--c1s)}.empty .eart.k2:before{background:var(--c2s)}.empty .eart.k3:before{background:var(--c3s)}
.empty .eart > *{position:relative}
.empty .eart img{width:84px;height:84px;border-radius:26px;box-shadow:0 14px 30px -12px rgba(226,83,122,.6)}
.empty .eart span{font-size:50px;animation:float 3.4s ease-in-out infinite}
.empty .eart i{position:absolute;font-style:normal;color:var(--rose);opacity:.7;font-size:16px}
.empty .eart i:nth-of-type(1){right:-6px;top:4px}.empty .eart i:nth-of-type(2){left:-4px;bottom:10px;font-size:11px;color:#8f6bf0}
.empty h3{font:700 22px/1.2 var(--serif);color:var(--ink);margin:0 0 8px;letter-spacing:-.2px}
.empty p{margin:0 auto;max-width:280px}
.empty .hintdown{margin-top:20px;font-size:12.5px;font-weight:700;color:var(--rose);display:flex;flex-direction:column;align-items:center;gap:4px}
.empty .hintdown svg{width:18px;height:18px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(4px)}}

/* FAB */
.fadebot{position:fixed;left:0;right:0;bottom:0;height:calc(96px + var(--safeB));background:linear-gradient(rgba(0,0,0,0),var(--bg) 80%);pointer-events:none;z-index:19}
.dark .fadebot{background:linear-gradient(rgba(27,20,24,0),var(--bg) 80%)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safeB));z-index:20;color:#fff;font:800 16px/1 var(--font);letter-spacing:.01em;padding:8px 26px 8px 8px;border-radius:999px;display:flex;gap:12px;align-items:center;
  background:linear-gradient(135deg,#f0648b 0%,var(--rose) 45%,#ef7a5c 100%);
  box-shadow:0 14px 30px -10px rgba(226,83,122,.7),0 3px 8px rgba(226,83,122,.25),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .25s var(--spring)}
.fab .pl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.fab .pl svg{width:20px;height:20px}
.fab:active{transform:translateX(-50%) scale(.94)}

@media (prefers-reduced-motion:reduce){
  .intro .card,.intro .sechead,.intro .top,.intro .stats,.intro .banner,.intro .mood,.intro .tabs,.swap .sec,.swap .empty{animation:none}
  .tabind.anim{transition:none}
  .dot.on,.dot.wait,.badge:before,.empty .eart span,.empty .hintdown svg,.welcome .hero,.sk:after{animation:none}
  .card,.fab,.mood,.iconbtn{transition:none}
}

/* shared media placeholder (also used by detail) */
.ph{aspect-ratio:1/1;background:var(--bg2);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:44px}
.ph.g1{background:linear-gradient(140deg,#ffd3c9,#ffeee2)}.ph.g2{background:linear-gradient(140deg,#c9f0de,#eefaf3)}.ph.g3{background:linear-gradient(140deg,#ddd1ff,#f5f0ff)}
.dark .ph.g1{background:linear-gradient(140deg,#5a2c26,#3a2522)}.dark .ph.g2{background:linear-gradient(140deg,#1f4a3b,#1d2f29)}.dark .ph.g3{background:linear-gradient(140deg,#3d3166,#2a2440)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(30,15,22,.42);z-index:40;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.veil.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;max-height:94vh;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);padding:0 18px calc(24px + var(--safeB));overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{position:sticky;top:0;padding:10px 0 6px;background:var(--bg);z-index:3;display:flex;align-items:center;justify-content:center}
.grab i{width:42px;height:5px;border-radius:3px;background:var(--line)}
.grab .x{position:absolute;right:-4px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--bg2);font-size:15px;display:grid;place-items:center;color:var(--ink2)}
.sheet h3{font:700 24px/1.15 var(--serif);margin:6px 0 14px;padding-right:30px}

/* detail */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:1/1;max-height:62vh;object-fit:cover;border-radius:22px;scroll-snap-align:center;background:var(--bg2)}
.gal .ph{flex:none;width:100%;border-radius:22px}
.galdots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.galdots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:.2s}
.galdots i.on{background:var(--rose);width:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-weight:700;font-size:12.5px}
.p1{background:var(--c1s);color:var(--c1)}.p2{background:var(--c2s);color:var(--c2)}.p3{background:var(--c3s);color:var(--c3)}
.dtitle{font:700 26px/1.15 var(--serif);margin:14px 0 6px;word-break:break-word}
.dprice{font:800 20px/1 var(--font);margin:10px 0 0}
.box{background:var(--card);border-radius:18px;padding:13px 15px;margin-top:12px;box-shadow:0 1px 3px rgba(120,60,80,.06)}
.box .k{font:700 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.box .v{white-space:pre-wrap;word-break:break-word}
.meta{font-size:12px;color:var(--ink3);margin-top:14px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:15px;background:var(--card);box-shadow:0 1px 3px rgba(120,60,80,.08);margin-top:10px}
.btn.pri{background:linear-gradient(135deg,var(--rose),#f07a5a);color:#fff;box-shadow:0 8px 20px rgba(226,83,122,.35)}
.btn.dark2{background:var(--ink);color:var(--bg)}
.btn.ok{background:#2fb078;color:#fff}
.btn.danger{color:#e0413a;background:transparent;box-shadow:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.secret{background:repeating-linear-gradient(-45deg,var(--roseSoft),var(--roseSoft) 10px,transparent 10px,transparent 20px);border:1.5px dashed var(--rose2);border-radius:18px;padding:12px 14px;margin-top:12px;font-size:13px;color:var(--ink2)}
.secret b{color:var(--ink)}

/* form */
.fl{display:block;font:700 12px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:18px 2px 8px}
.inp{width:100%;padding:14px 15px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);outline:none;font-size:16px;transition:border .15s}
.inp:focus{border-color:var(--rose2)}
textarea.inp{min-height:84px;resize:vertical}
.pricerow{display:flex;gap:8px}.pricerow .inp:first-child{flex:1}
.pricerow select{width:86px;flex:none;appearance:none;text-align:center}
.cats{display:grid;gap:9px}
.cat{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:17px;background:var(--card);border:2px solid transparent;text-align:left;transition:.15s}
.cat .ci{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none}
.cat b{display:block;font-size:15px}.cat span{font-size:12.5px;color:var(--ink2)}
.cat.on.k1{border-color:var(--c1);background:var(--c1s)}.cat.on.k2{border-color:var(--c2);background:var(--c2s)}.cat.on.k3{border-color:var(--c3);background:var(--c3s)}
.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pth{flex:none;width:92px;height:92px;border-radius:18px;overflow:hidden;position:relative;background:var(--bg2)}
.pth img{width:100%;height:100%;object-fit:cover}
.pth .rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px;display:grid;place-items:center}
.pth .first{position:absolute;left:5px;bottom:5px;font:800 9.5px/1 var(--font);padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.9);color:#2e1d27;text-transform:uppercase}
.addph{flex:none;width:92px;height:92px;border-radius:18px;border:2px dashed var(--ink3);display:grid;place-items:center;text-align:center;color:var(--ink2);font-size:12px;font-weight:700;line-height:1.2}
.addph .pl{font-size:26px;display:block}
.hint{font-size:12.5px;color:var(--ink2);margin:6px 2px 0}

/* setup / settings */
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{position:relative;padding:0 0 14px 40px;font-size:14.5px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--roseSoft);color:var(--rose);font-weight:800;display:grid;place-items:center;font-size:13px}
code,.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--bg2);padding:2px 6px;border-radius:6px;word-break:break-all}
pre.code{display:block;padding:12px;white-space:pre-wrap;margin:8px 0 0;line-height:1.45}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:11px 8px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* welcome / locked */
.welcome{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 6px}
.welcome .hero{margin-bottom:22px;position:relative;animation:float 3.4s ease-in-out infinite}
.welcome .hero img{width:112px;height:112px;border-radius:34px;display:block;box-shadow:0 22px 44px -16px rgba(226,83,122,.6),0 0 0 1px rgba(255,255,255,.6) inset}
.welcome .hero:before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,143,171,.35),rgba(255,143,171,0));z-index:-1}
@keyframes float{50%{transform:translateY(-8px)}}
.welcome h1{font:700 32px/1.1 var(--serif);margin:0 0 10px;letter-spacing:-.4px}
.welcome p{color:var(--ink2);margin:0 0 26px;font-size:15px;line-height:1.45;max-width:300px}
.welcome .lockchip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--card);box-shadow:var(--cardShadow);font-size:12.5px;font-weight:700;color:var(--ink2)}
.welcome .lockchip svg{width:14px;height:14px;color:var(--rose)}
.choice{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:22px;background:var(--card);box-shadow:var(--cardShadow);margin-bottom:12px;width:100%;max-width:400px}
.choice .e{font-size:26px;width:50px;height:50px;border-radius:16px;background:var(--roseSoft);display:grid;place-items:center;flex:none}
.choice b{display:block;font-size:16px}.choice span{font-size:13px;color:var(--ink2)}
.choice .e + span span{display:block;margin-top:2px}

/* toast + confetti */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;z-index:60;transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{transform:translate(-50%,0)}
.conf{position:fixed;top:-30px;z-index:70;font-size:24px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--rose);animation:sp 0.8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<input type="file" id="file" accept="image/*" multiple class="hidden">
<div id="toast" class="toast"></div>

<script>
"use strict";
/* ================= базовое ================= */
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
const inTg = !!(tg && tg.initData);
const tgUser = (inTg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (n = 16) => { const a = "abcdefghijkmnpqrstuvwxyz23456789"; const b = crypto.getRandomValues(new Uint8Array(n)); return Array.from(b, (x) => a[x % a.length]).join(""); };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const haptic = (t) => { try { if (!tg || !tg.HapticFeedback) return; if (t === "ok" || t === "error" || t === "warning") tg.HapticFeedback.notificationOccurred(t === "ok" ? "success" : t); else tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };

const CATS = {
  1: { key: 1, emo: "🔥", name: "Очень нужно", sub: "Срочно, прям горит", short: "Срочно" },
  2: { key: 2, emo: "🌿", name: "Нужно", sub: "Не горит, но пригодится", short: "Нужно" },
  3: { key: 3, emo: "✨", name: "Хочу-хочу", sub: "Не горит, но очень хочется", short: "Хочу" },
};
const CURS = ["€", "₴", "₽", "$", "zł", "£"];

/* ================= параметры ссылки ================= */
const qs = new URLSearchParams(location.search);
let CFG = { p: qs.get("p"), k: qs.get("k"), l: qs.get("l") };
if (!(CFG.p && CFG.k && CFG.l)) {
  const saved = LS.get("wl_cfg", null);
  if (saved && saved.p && saved.k && saved.l) CFG = saved; else CFG = null;
} else LS.set("wl_cfg", CFG);
const LIST = CFG ? CFG.l : "demo";

/* ================= доступ: только двое ================= */
const ACCESS = { fllezzka: "owner", xupxy: "viewer" }; // ник в Telegram → роль
const myNick = ((tgUser && tgUser.username) || "").toLowerCase();
const ALLOWED = inTg && Object.prototype.hasOwnProperty.call(ACCESS, myNick);
const K = (s) => "wl_" + LIST + "_" + s;

function botLink(cfg) {
  const base = location.origin + location.pathname.replace(/index\.html$/, "");
  return base + "?p=" + encodeURIComponent(cfg.p) + "&k=" + encodeURIComponent(cfg.k) + "&l=" + encodeURIComponent(cfg.l);
}

/* ================= хранилище ================= */
// Демо: localStorage. Облако: Firebase Firestore (обновляется в реальном времени).
function makeLocalStore() {
  const KEY = "wl_demo_db";
  const read = () => LS.get(KEY, { items: {}, photos: {}, meta: {} });
  let subs = [];
  const emit = () => { const d = read(); subs.forEach((f) => f(d)); };
  window.addEventListener("storage", (e) => { if (e.key === KEY) emit(); });
  return {
    mode: "demo",
    start(onData) { subs.push(onData); setTimeout(emit, 0); },
    async saveItem(item, photos) {
      const d = read(); d.items[item.id] = Object.assign(d.items[item.id] || {}, item);
      if (photos) d.photos[item.id] = photos;
      if (!LS.set(KEY, d)) throw new Error("Память демо-режима заполнена — подключи синхронизацию");
      emit();
    },
    async patchItem(id, patch) { const d = read(); if (!d.items[id]) return; Object.assign(d.items[id], patch); LS.set(KEY, d); emit(); },
    async deleteItem(id) { const d = read(); delete d.items[id]; delete d.photos[id]; LS.set(KEY, d); emit(); },
    async getPhotos(id) { return read().photos[id] || []; },
    async saveMeta(patch) { const d = read(); d.meta = Object.assign(d.meta || {}, patch); LS.set(KEY, d); emit(); },
  };
}

async function makeCloudStore(cfg) {
  const V = "10.12.2";
  const appM = await import("https://www.gstatic.com/firebasejs/" + V + "/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/" + V + "/firebase-firestore.js");
  const app = appM.initializeApp({ apiKey: cfg.k, projectId: cfg.p, authDomain: cfg.p + ".firebaseapp.com" }, "wl");
  let db;
  try { db = fs.initializeFirestore(app, { experimentalAutoDetectLongPolling: true }); } catch (e) { db = fs.getFirestore(app); }
  const L = cfg.l;
  const col = (c) => fs.collection(db, "lists", L, c);
  const ref = (c, id) => fs.doc(db, "lists", L, c, id);
  const photoCache = {};
  return {
    mode: "cloud",
    start(onData, onStatus) {
      const state = { items: {}, meta: {} }; let gotItems = false, gotMeta = false;
      const push = () => { if (gotItems) onData({ items: state.items, meta: state.meta }); };
      fs.onSnapshot(col("items"), { includeMetadataChanges: true }, (snap) => {
        const items = {}; snap.forEach((d) => { items[d.id] = Object.assign({ id: d.id }, d.data()); });
        state.items = items; gotItems = true; push();
        onStatus(snap.metadata.fromCache ? "cache" : "on");
      }, (err) => onStatus("err", err));
      fs.onSnapshot(ref("meta", "main"), (d) => { state.meta = d.exists() ? d.data() : {}; gotMeta = true; push(); }, (err) => onStatus("err", err));
    },
    async saveItem(item, photos) {
      if (photos) { await fs.setDoc(ref("photos", item.id), { p: photos }); photoCache[item.id] = photos; }
      const data = Object.assign({}, item); delete data.id;
      await fs.setDoc(ref("items", item.id), data, { merge: true });
    },
    async patchItem(id, patch) { await fs.setDoc(ref("items", id), patch, { merge: true }); },
    async deleteItem(id) { await fs.deleteDoc(ref("items", id)); try { await fs.deleteDoc(ref("photos", id)); } catch (e) {} delete photoCache[id]; },
    async getPhotos(id) {
      if (photoCache[id]) return photoCache[id];
      const d = await fs.getDoc(ref("photos", id)); const p = d.exists() ? d.data().p || [] : [];
      photoCache[id] = p; return p;
    },
    invalidatePhotos(id) { delete photoCache[id]; },
    async saveMeta(patch) { await fs.setDoc(ref("meta", "main"), patch, { merge: true }); },
  };
}

/* ================= состояние ================= */
const S = {
  store: null, items: {}, meta: {}, loaded: false, status: "demo",
  role: ALLOWED ? ACCESS[myNick] : null, // "owner" | "viewer" — по нику
  tab: "all", seen: LS.get(K("seen"), null), knownIds: null,
};
function saveSeen() { LS.set(K("seen"), S.seen); }
const isOwner = () => S.role === "owner";

/* ================= фото ================= */
function loadImg(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => { res(im); }; im.onerror = () => rej(new Error("Не получилось открыть фото")); im.src = u; });
}
function drawTo(im, max, q, square) {
  let w = im.naturalWidth, h = im.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
  if (square) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; w = h = m; }
  const s = Math.min(1, max / Math.max(w, h)); const cw = Math.round(w * s), ch = Math.round(h * s);
  const c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, cw, ch); x.drawImage(im, sx, sy, sw, sh, 0, 0, cw, ch);
  return c.toDataURL("image/jpeg", q);
}
async function compress(file) {
  const im = await loadImg(file);
  let full = drawTo(im, 1280, 0.8);
  if (full.length > 230000) full = drawTo(im, 1024, 0.72);
  if (full.length > 230000) full = drawTo(im, 820, 0.65);
  return full;
}
async function thumbFrom(dataUrl) {
  const im = await new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = dataUrl; });
  return drawTo(im, 420, 0.72, true);
}

/* ================= утилиты UI ================= */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
function confetti() {
  const em = ["🎉", "💖", "✨", "🎁", "🌸", "💫"];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("div"); s.className = "conf"; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = 1.8 + Math.random() * 1.6 + "s"; s.style.animationDelay = Math.random() * 0.4 + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 4200);
  }
}
function ago(ts) {
  if (!ts) return ""; const d = (Date.now() - ts) / 1000;
  if (d < 60) return "только что"; if (d < 3600) return Math.floor(d / 60) + " мин назад";
  if (d < 86400) return Math.floor(d / 3600) + " ч назад";
  const days = Math.floor(d / 86400); if (days === 1) return "вчера"; if (days < 7) return days + " дн назад";
  return new Date(ts).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}
function priceStr(it) { if (!it.price && it.price !== 0) return ""; const n = Number(String(it.price).replace(",", ".")); const v = isFinite(n) && String(it.price).trim() !== "" ? n.toLocaleString("ru-RU") : esc(it.price); return v + " " + esc(it.cur || "€"); }
function fixLink(u) { u = (u || "").trim(); if (!u) return ""; if (!/^https?:\/\//i.test(u)) u = "https://" + u; return u; }
function openLink(u) { u = fixLink(u); if (!u) return; try { if (tg && tg.openLink) { tg.openLink(u); return; } } catch (e) {} window.open(u, "_blank"); }
function copy(text) {
  const done = () => { toast("Скопировано 📋"); haptic("ok"); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Не удалось скопировать"); } t.remove(); }
}

/* ================= шторки (bottom sheets) ================= */
const sheets = [];
function openSheet(html, mount) {
  const veil = document.createElement("div"); veil.className = "veil";
  const sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = '<div class="grab"><i></i><button class="x" data-close>✕</button></div>' + html;
  document.body.append(veil, sh); document.body.classList.add("lock");
  const entry = { veil, sh }; sheets.push(entry);
  requestAnimationFrame(() => { veil.classList.add("on"); sh.classList.add("on"); });
  veil.onclick = () => closeSheet();
  sh.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) closeSheet(); });
  // свайп вниз, чтобы закрыть
  let y0 = null, dy = 0;
  sh.addEventListener("touchstart", (e) => { if (sh.scrollTop <= 0 && !e.target.closest("input,textarea,.gal,.photos")) { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = "none"; } }, { passive: true });
  sh.addEventListener("touchmove", (e) => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 0) sh.style.transform = "translateY(" + dy + "px)"; }, { passive: true });
  sh.addEventListener("touchend", () => { if (y0 == null) return; sh.style.transition = ""; if (dy > 110) closeSheet(); else sh.style.transform = ""; y0 = null; });
  syncBack();
  if (mount) mount(sh);
  return sh;
}
function closeSheet() {
  const e = sheets.pop(); if (!e) return;
  e.veil.classList.remove("on"); e.sh.style.transform = ""; e.sh.classList.remove("on");
  setTimeout(() => { e.veil.remove(); e.sh.remove(); }, 320);
  if (!sheets.length) document.body.classList.remove("lock");
  syncBack();
}
function closeAll() { while (sheets.length) closeSheet(); }
function syncBack() { try { if (!tg || !tg.BackButton) return; if (sheets.length) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {} }
if (tg && tg.BackButton) try { tg.BackButton.onClick(() => closeSheet()); } catch (e) {}

/* ================= рендер ================= */
function sortedItems(filter) {
  return Object.values(S.items).filter(filter).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}
function itemFlag(it) {
  if (isOwner() || !S.seen) return "";
  const s = S.seen[it.id];
  if (s == null) return "new";
  if ((it.editedAt || 0) > s) return "upd";
  return "";
}
/* ---- главный экран: иконки, приветствие, анимации ---- */
const IC = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.2 4.5 4.5 0 0 0 7 18z"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

      fileIn.value = "";
      fileIn.onchange = async () => {
        const files = Array.from(fileIn.files || []).slice(0, 4 - st.photos.length);
        if (!files.length) return;
        const btn = $("#addph", sh); if (btn) btn.innerHTML = '<span><span class="pl">⏳</span>Сжимаю…</span>';
        for (const f of files) { try { st.photos.push(await compress(f)); } catch (err) { toast(err.message); } }
        drawPhotos();
      };
      fileIn.click();
      return;
    }
    if (e.target.closest("#f_save")) save();
  });
  async function save() {
    if (st.busy) return;
    const title = $("#f_title", sh).value.trim();
    if (!title) { $("#f_title", sh).focus(); toast("Напиши, что ты хочешь 🙂"); haptic("error"); return; }
    st.busy = true; const btn = $("#f_save", sh); btn.textContent = "Сохраняю…"; btn.style.opacity = .7;
    try {
      const now = Date.now(); const cur = $("#f_cur", sh).value; LS.set("wl_cur", cur);
      const item = {
        id: it ? it.id : now.toString(36) + uid(6),
        title, cat: st.cat, price: $("#f_price", sh).value.trim(), cur,
        link: $("#f_link", sh).value.trim(), details: $("#f_details", sh).value.trim(), note: $("#f_note", sh).value.trim(),
        thumb: st.photos.length ? await thumbFrom(st.photos[0]) : "", photoCount: st.photos.length,
        createdAt: it ? it.createdAt || now : now, editedAt: now,
      };
      if (isNew) { item.done = false; item.gift = false; }
      if (S.store.invalidatePhotos) S.store.invalidatePhotos(item.id);
      await S.store.saveItem(item, st.photos);
      haptic("ok"); closeSheet(); toast(isNew ? "Добавлено в вишлист 💗" : "Сохранено ✓");
      if (isNew && S.tab !== "all" && S.tab !== String(st.cat)) { S.tab = "all"; render(); }
    } catch (err) {
      st.busy = false; btn.textContent = "Попробовать ещё раз"; btn.style.opacity = 1; haptic("error");
      toast("Не сохранилось: " + (err.code === "permission-denied" ? "проверь правила Firestore" : err.message || err));
    }
  }
}

function openMood() {
  const sh = openSheet('<h3>О чём ты сейчас думаешь? 💭</h3><textarea class="inp" id="m_txt" maxlength="500" style="min-height:130px" placeholder="Например: очень хочу на море, и мечтаю о новом свитере, потому что холодно 🥶">' + esc(S.meta.mood || "") + '</textarea><div class="hint">Он увидит это сразу, вверху вишлиста.</div><button class="btn pri" id="m_save" style="margin-top:18px">Сохранить</button>' + (S.meta.mood ? '<button class="btn danger" id="m_clear">Очистить</button>' : ""));
  setTimeout(() => { try { $("#m_txt", sh).focus(); } catch (e) {} }, 350);
  sh.addEventListener("click", async (e) => {
    if (e.target.closest("#m_save") || e.target.closest("#m_clear")) {
      const v = e.target.closest("#m_clear") ? "" : $("#m_txt", sh).value.trim();
      try { await S.store.saveMeta({ mood: v, moodAt: Date.now() }); haptic("ok"); closeSheet(); toast(v ? "Обновлено 💭" : "Очищено"); }
      catch (err) { toast("Ошибка: " + (err.message || err)); }
    }
  });
}

function openSettings() {
  const link = CFG ? botLink(CFG) : "";
  let h = "<h3>Настройки</h3>" +
    '<label class="fl">Кто я</label><div class="box">' + (isOwner() ? "👑 Хозяйка вишлиста" : "🕵️ Смотрю вишлист") + " · @" + esc(myNick) + '</div>' +
    '<div class="hint">🔒 Вишлист открывается только у @fllezzka и @xupxy.</div>';
  if (isOwner()) h += '<label class="fl">Как тебя зовут</label><input class="inp" id="s_name" maxlength="40" placeholder="Имя (он увидит «Вишлист Имя»)" value="' + esc(S.meta.ownerName || "") + '">';
  h += '<label class="fl">Синхронизация</label>';
  if (S.store.mode === "demo") h += '<div class="box">☁️ Сейчас <b>демо-режим</b>: желания хранятся только на этом устройстве.</div><button class="btn pri" data-s="setup">Подключить синхронизацию</button>';
  else h += '<div class="box">✅ Подключено к базе <code>' + esc(CFG.p) + "</code>.<br>Список: <code>" + esc(CFG.l) + '</code></div><button class="btn" data-s="copy">📋 Скопировать ссылку для BotFather</button>';
  h += '<div class="meta">Вишлист 💗 сделан с любовью</div>';
  const sh = openSheet(h);
  sh.addEventListener("click", (e) => {
    const r = e.target.closest("[data-r]");
    if (r) { closeSheet(); setRole(r.dataset.r); return; }
    const s = e.target.closest("[data-s]"); if (!s) return;
    if (s.dataset.s === "setup") { closeSheet(); openSetup(); }
    if (s.dataset.s === "copy") copy(link);
  });
  const nm = $("#s_name", sh);
  if (nm) nm.addEventListener("change", () => S.store.saveMeta({ ownerName: nm.value.trim() }).then(() => toast("Имя сохранено")).catch(() => {}));
}

const RULES = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /lists/{list}/{col}/{doc} {\n      allow read, write: if list.size() >= 12\n        && col in ['items', 'photos', 'meta'];\n    }\n  }\n}";
function openSetup() {
  const h = "<h3>Подключить синхронизацию ☁️</h3>" +
    '<p style="color:var(--ink2);margin:-4px 0 16px">Один раз, ~5 минут. Бесплатно (Firebase от Google). После этого вы оба видите один и тот же список, и он обновляется вживую.</p>' +
    '<ol class="steps">' +
    '<li>Открой <b>console.firebase.google.com</b> → <b>Создать проект</b> (любое имя, аналитику можно выключить).</li>' +
    '<li>Слева <b>Build → Firestore Database → Create database</b>. Регион — <b>europe-west</b>, режим — <b>production</b>.</li>' +
    '<li>Там же вкладка <b>Rules</b> — замени всё на это и нажми <b>Publish</b>:<pre class="code" id="rules">' + esc(RULES) + '</pre><button class="btn" data-x="rules" style="margin-top:8px">📋 Скопировать правила</button></li>' +
    '<li>Шестерёнка → <b>Project settings</b> → внизу значок <b>&lt;/&gt;</b> (Web app) → любое имя → <b>Register</b>. Скопируй весь блок <code>firebaseConfig</code> и вставь сюда:</li>' +
    "</ol>" +
    '<textarea class="inp" id="cfg" style="min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px" placeholder="const firebaseConfig = {\n  apiKey: &quot;…&quot;,\n  projectId: &quot;…&quot;,\n  …\n};"></textarea>' +
    '<button class="btn pri" data-x="make" style="margin-top:14px">Готово — сделать ссылку</button><div id="out"></div>';
  const sh = openSheet(h);
  sh.addEventListener("click", (e) => {
    const b = e.target.closest("[data-x]"); if (!b) return;
    if (b.dataset.x === "rules") copy(RULES);
    if (b.dataset.x === "copylink") copy(b.dataset.link);
    if (b.dataset.x === "openlink") location.href = b.dataset.link;
    if (b.dataset.x === "make") {
      const t = $("#cfg", sh).value;
      const get = (k) => { const m = t.match(new RegExp('["\']?' + k + '["\']?\\s*:\\s*["\']([^"\']+)["\']')); return m ? m[1].trim() : ""; };
      const p = get("projectId"), k = get("apiKey");
      if (!p || !k) { toast("Не нашла apiKey и projectId — вставь весь блок"); haptic("error"); return; }
      const cfg = { p, k, l: (CFG && CFG.p === p && CFG.l) || uid(18) };
      const link = botLink(cfg);
      $("#out", sh).innerHTML = '<div class="box" style="margin-top:16px"><div class="k">Ссылка для BotFather</div><div class="v code" style="background:none;padding:0">' + esc(link) + "</div></div>" +
        '<button class="btn dark2" data-x="copylink" data-link="' + esc(link) + '">📋 Скопировать ссылку</button>' +
        '<button class="btn" data-x="openlink" data-link="' + esc(link) + '">Открыть вишлист по ней →</button>' +
        '<div class="hint">В @BotFather: <b>/mybots</b> → твой бот → <b>Bot Settings → Configure Mini App</b> (или Menu Button) → вставь эту ссылку.</div>';
      haptic("ok");
    }
  });
}

/* ================= новые желания вживую ================= */
function onData(d) {
  const prevKnown = S.knownIds;
  S.items = d.items || {}; S.meta = d.meta || {}; S.loaded = true;
  const ids = Object.keys(S.items);
  if (prevKnown && !isOwner()) {
    const fresh = ids.filter((id) => !prevKnown.has(id));
    if (fresh.length === 1) { toast("✨ Новое желание: " + S.items[fresh[0]].title); haptic("ok"); }
    else if (fresh.length > 1) { toast("✨ Новых желаний: " + fresh.length); haptic("ok"); }
  }
  S.knownIds = new Set(ids);
  render();
}

/* ================= старт ================= */
function renderLocked() {
  $("#app").className = "";
  $("#app").innerHTML = '<div class="welcome"><div class="hero"><img src="logo.svg" alt=""></div><h1>Доступ закрыт</h1><p>' +
    (inTg ? "Этот вишлист приватный — он только для двоих." : "Открой вишлист через Telegram-бота.") + '</p><span class="lockchip">' + IC.lock + "Только для своих</span></div>";
}
(async function boot() {
  if (!ALLOWED) { try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {} renderLocked(); return; }
  if (!S.seen && S.role === "viewer") { S.seen = {}; saveSeen(); }
  try {
    if (tg) { tg.ready(); try { tg.expand(); } catch (e) {} }
    const dark = tg && tg.colorScheme === "dark";
    if (dark) document.documentElement.classList.add("dark");
    const bg = dark ? "#1b1418" : "#fbf4ef";
    try { if (tg && tg.setHeaderColor) tg.setHeaderColor(bg); if (tg && tg.setBackgroundColor) tg.setBackgroundColor(bg); } catch (e) {}
    try { if (tg && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  } catch (e) {}

  render();
  try {
    S.store = CFG ? await makeCloudStore(CFG) : makeLocalStore();
    S.status = CFG ? "cache" : "demo";
  } catch (e) {
    console.error(e); S.store = makeLocalStore(); S.status = "demo";
    toast("Не удалось подключиться к облаку — открыт демо-режим");
  }
  S.store.start(onData, (st, err) => {
    S.status = st;
    if (st === "err") { console.error(err); toast(err && err.code === "permission-denied" ? "База не пускает: проверь правила Firestore" : "Нет связи с базой"); }
    const dot = $(".sync"); if (dot) render();
  });
  if (!S.role) render();
  // если открыла хозяйка из Telegram — запомним имя
  setTimeout(() => {
    if (isOwner() && tgUser && tgUser.first_name && S.loaded && !S.meta.ownerName) S.store.saveMeta({ ownerName: tgUser.first_name, ownerId: tgUser.id }).catch(() => {});
  }, 1500);
})();
</script>
