<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6e2"/>
      <stop offset=".55" stop-color="#ffe6d6"/>
      <stop offset="1" stop-color="#e9ddff"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7c9c"/>
      <stop offset=".6" stop-color="#e2537a"/>
      <stop offset="1" stop-color="#c23d68"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6ea"/>
      <stop offset="1" stop-color="#ffe0bd"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#a8325a" flood-opacity=".28"/>
    </filter>
    <clipPath id="hc">
      <path d="M256 418C170 362 104 304 104 226c0-48 36-86 82-86 32 0 56 17 70 42 14-25 38-42 70-42 46 0 82 38 82 86 0 78-66 136-152 192z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="270" r="210" fill="url(#glow)"/>
  <!-- heart-shaped gift -->
  <g filter="url(#sh)">
    <path d="M256 418C170 362 104 304 104 226c0-48 36-86 82-86 32 0 56 17 70 42 14-25 38-42 70-42 46 0 82 38 82 86 0 78-66 136-152 192z" fill="url(#heart)"/>
  </g>
  <g clip-path="url(#hc)">
    <rect x="238" y="120" width="36" height="320" fill="url(#ribbon)"/>
    <rect x="90" y="236" width="340" height="32" fill="url(#ribbon)" opacity=".95"/>
    <ellipse cx="190" cy="196" rx="52" ry="30" fill="#fff" opacity=".18" transform="rotate(-28 190 196)"/>
  </g>
  <!-- bow -->
  <g transform="translate(256 182)">
    <path d="M0 0C-18-34-62-50-78-30c-14 18 6 44 78 30z" fill="#fff4e6" stroke="#f3c9a0" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 0C18-34 62-50 78-30c14 18-6 44-78 30z" fill="#fff4e6" stroke="#f3c9a0" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-6 4c-10 20-24 34-40 42M6 4c10 20 24 34 40 42" stroke="#fff4e6" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle r="15" fill="#ffe7cc" stroke="#f3c9a0" stroke-width="4"/>
  </g>
  <!-- sparkles -->
  <g fill="#fff">
    <path d="M404 112l8 22 22 8-22 8-8 22-8-22-22-8 22-8z"/>
    <path d="M110 372l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" opacity=".9"/>
    <path d="M420 330l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" opacity=".85"/>
  </g>
  <g fill="#8f6bf0" opacity=".55">
    <circle cx="96" cy="128" r="7"/><circle cx="440" cy="250" r="5"/>
  </g>
</svg>
