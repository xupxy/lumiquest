<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#fff4f7"/>
      <stop offset=".55" stop-color="#ffd9e6"/>
      <stop offset="1" stop-color="#e7d6ff"/>
    </radialGradient>
    <linearGradient id="body" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ff9db8"/>
      <stop offset=".55" stop-color="#ff6f98"/>
      <stop offset="1" stop-color="#ec4f80"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#ffe3c2"/>
    </linearGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ee"/>
      <stop offset="1" stop-color="#ffd8b0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#c2335f" flood-opacity=".28"/>
    </filter>
    <clipPath id="hc">
      <path d="M256 430C166 372 96 312 96 228c0-52 40-92 90-92 32 0 56 16 70 40 14-24 38-40 70-40 50 0 90 40 90 92 0 84-70 144-160 202z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- soft floating hearts -->
  <g fill="#ff8fb0" opacity=".55">
    <path transform="translate(70 92) scale(.9) rotate(-14)" d="M0 8C-10 0-20-4-20-14c0-6 5-11 11-11 4 0 7 2 9 5 2-3 5-5 9-5 6 0 11 5 11 11 0 10-10 14-20 22z"/>
    <path transform="translate(440 150) scale(.7) rotate(16)" d="M0 8C-10 0-20-4-20-14c0-6 5-11 11-11 4 0 7 2 9 5 2-3 5-5 9-5 6 0 11 5 11 11 0 10-10 14-20 22z"/>
    <path transform="translate(452 408) scale(1.05) rotate(10)" d="M0 8C-10 0-20-4-20-14c0-6 5-11 11-11 4 0 7 2 9 5 2-3 5-5 9-5 6 0 11 5 11 11 0 10-10 14-20 22z"/>
  </g>
  <g fill="#b99bff" opacity=".6">
    <circle cx="96" cy="300" r="7"/><circle cx="424" cy="300" r="5"/><circle cx="140" cy="452" r="6"/>
  </g>

  <!-- body -->
  <g filter="url(#sh)">
    <path d="M256 430C166 372 96 312 96 228c0-52 40-92 90-92 32 0 56 16 70 40 14-24 38-40 70-40 50 0 90 40 90 92 0 84-70 144-160 202z" fill="url(#body)"/>
  </g>
  <g clip-path="url(#hc)">
    <!-- ribbon -->
    <!-- gloss -->
    <ellipse cx="168" cy="190" rx="44" ry="24" fill="#fff" opacity=".35" transform="rotate(-32 168 190)"/>
    <circle cx="206" cy="166" r="8" fill="#fff" opacity=".55"/>
  </g>

  <!-- face -->
  <g>
    <!-- happy closed eyes -->
    <path d="M176 260q18-20 36 0" fill="none" stroke="#5a1f37" stroke-width="9" stroke-linecap="round"/>
    <path d="M300 260q18-20 36 0" fill="none" stroke="#5a1f37" stroke-width="9" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="166" cy="296" rx="24" ry="14" fill="#ff3d7a" opacity=".32"/>
    <ellipse cx="346" cy="296" rx="24" ry="14" fill="#ff3d7a" opacity=".32"/>
    <g fill="#fff" opacity=".8"><circle cx="156" cy="290" r="3.5"/><circle cx="166" cy="286" r="2.5"/><circle cx="336" cy="290" r="3.5"/><circle cx="346" cy="286" r="2.5"/></g>
    <!-- mouth -->
    <path d="M232 290q24 30 48 0z" fill="#7a2442" stroke="#5a1f37" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M244 304q12 9 24 0q-12-7-24 0z" fill="#ff8fab"/>
  </g>

  <!-- bow -->
  <g transform="translate(256 150)">
    <path d="M0 0C-16-40-70-60-90-34c-16 22 8 52 90 34z" fill="url(#bow)" stroke="#f0bf8f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 0C16-40 70-60 90-34c16 22-8 52-90 34z" fill="url(#bow)" stroke="#f0bf8f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-52-24c10-4 24-2 36 8M52-24c-10-4-24-2-36 8" fill="none" stroke="#f0bf8f" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <circle r="17" fill="#ffe6c9" stroke="#f0bf8f" stroke-width="5"/>
    <circle cx="-5" cy="-5" r="4" fill="#fff" opacity=".8"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <path d="M400 70l9 25 25 9-25 9-9 25-9-25-25-9 25-9z"/>
    <path d="M92 380l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
    <path d="M430 240l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" opacity=".9"/>
  </g>
  <g fill="#ffd36b">
    <path d="M118 150l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
  </g>
</svg>
